# The Blossom workspace (ARCHITECTURE §1, PLAN §4). Edited only by M1.1 and by gate-fix agents (PLAN §2.4).
#
# Members are globs, so a crate added under `crates/`, `systems/` or `tests/` needs no edit here. Internal
# dependency edges are pre-declared in each crate's manifest and checked against `xtask/layers.toml` by
# `cargo run -p xtask -- check-layers`.

[workspace]
resolver = "3"
members = [
    "crates/*",
    "systems/*",
    "tests/integration",
    "tests/codegen-corpus",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# No project license has been chosen (PLAN §4 D19): nothing is published.
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
indexing_slicing = "warn"

[workspace.dependencies]
# ---- internal crates (ARCHITECTURE §1.2), by path ----
blossom = { path = "crates/blossom" }
blossom-analysis = { path = "crates/blossom-analysis" }
blossom-artifact = { path = "crates/blossom-artifact" }
blossom-base = { path = "crates/blossom-base" }
blossom-bench = { path = "crates/blossom-bench" }
blossom-build = { path = "crates/blossom-build" }
blossom-cli = { path = "crates/blossom-cli" }
blossom-codegen = { path = "crates/blossom-codegen" }
blossom-driver = { path = "crates/blossom-driver" }
blossom-engine = { path = "crates/blossom-engine" }
blossom-front = { path = "crates/blossom-front" }
blossom-ir = { path = "crates/blossom-ir" }
blossom-kernel = { path = "crates/blossom-kernel" }
blossom-lattice = { path = "crates/blossom-lattice" }
blossom-ldfi = { path = "crates/blossom-ldfi" }
blossom-lsp = { path = "crates/blossom-lsp" }
blossom-node = { path = "crates/blossom-node" }
blossom-oracle = { path = "crates/blossom-oracle" }
blossom-plan = { path = "crates/blossom-plan" }
blossom-prov = { path = "crates/blossom-prov" }
blossom-rewrite = { path = "crates/blossom-rewrite" }
blossom-runtime = { path = "crates/blossom-runtime" }
blossom-sat = { path = "crates/blossom-sat" }
blossom-schema = { path = "crates/blossom-schema" }
blossom-sim = { path = "crates/blossom-sim" }
blossom-smt = { path = "crates/blossom-smt" }
blossom-std-host = { path = "crates/blossom-std-host" }
blossom-std-src = { path = "crates/blossom-std-src" }
blossom-store = { path = "crates/blossom-store" }
blossom-syntax = { path = "crates/blossom-syntax" }
blossom-testkit = { path = "crates/blossom-testkit" }
blossom-trace = { path = "crates/blossom-trace" }
blossom-value = { path = "crates/blossom-value" }
blossom-verify = { path = "crates/blossom-verify" }
blossom-wire = { path = "crates/blossom-wire" }

# ---- light external crates of ARCHITECTURE §1.2 (versions verified by building; licenses in DEPENDENCIES.md) ----
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32c = "0.6.8"
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
indexmap = "2.14.2"
insta = "1.48.0"
libtest-mimic = "0.8.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1.11.0"
rowan = "0.16.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
siphasher = "1.0.4"
smallvec = { version = "1.16.2", features = ["const_generics", "union", "serde"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

# Arithmetic behaves the same in every profile (ARCHITECTURE §12.1).
[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
overflow-checks = true
panic = "abort"

[profile.bench]
overflow-checks = true

[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2
