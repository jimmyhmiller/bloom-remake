[package]
name = "blossom-std-host"
description = "The Rust implementations behind the standard library's extern fns and extern table fns, as an ExternRegistry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blossom-base.workspace = true
blossom-value.workspace = true
blake3.workspace = true
crc32c.workspace = true
# The standard library's checksums, codecs and hashes (FOREIGN-PROTOCOLS §4); pure Rust, no C.
crc32fast = "1.5.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
snap = "1.1.1"
lz4_flex = { version = "0.11.6", default-features = false, features = ["frame", "safe-encode", "safe-decode", "std"] }
ruzstd = "0.8.3"
sha2 = "0.10.9"

[lints]
workspace = true
