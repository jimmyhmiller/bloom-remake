[package]
name = "blossom-vercel"
description = "A Blossom deployment as a Vercel function (docs/design/DEPLOY.md): each page request answered from the state store by the stateless engine, nothing running between requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blossom-base.workspace = true
blossom-value.workspace = true
blossom-front.workspace = true
blossom-artifact.workspace = true
blossom-driver.workspace = true
blossom-verify.workspace = true
blossom-std-host.workspace = true
blossom-runtime.workspace = true
blossom-statestore.workspace = true
blossom-statestore-postgres.workspace = true
blossom-statestore-s3.workspace = true
# Vercel's Rust runtime: its bridge hands each request to the handler (api/blossom.rs).
vercel_runtime = "=2.4.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"

# The function: Vercel builds this binary from its source file (deploy/vercel/vercel.json).
[[bin]]
name = "blossom-vercel"
path = "api/blossom.rs"

[lints]
workspace = true
