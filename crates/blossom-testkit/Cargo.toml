[package]
name = "blossom-testkit"
description = "The corpus runner with the status ratchet, the differential runner, the oracle Evaluator adapter, conformance suites, the Molly parity runner and input generation. Used only as a dev-dependency of integration-test crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blossom-base.workspace = true
blossom-value.workspace = true
blossom-lattice.workspace = true
blossom-std-src.workspace = true
blossom-syntax.workspace = true
blossom-ir.workspace = true
blossom-schema.workspace = true
blossom-artifact.workspace = true
blossom-front.workspace = true
blossom-analysis.workspace = true
blossom-rewrite.workspace = true
blossom-plan.workspace = true
blossom-oracle.workspace = true
blossom-driver.workspace = true
blossom-kernel.workspace = true
blossom-engine.workspace = true
blossom-prov.workspace = true
blossom-codegen.workspace = true
blossom-std-host.workspace = true
blossom-wire.workspace = true
blossom-store.workspace = true
blossom-trace.workspace = true
blossom-node.workspace = true
blossom-runtime.workspace = true
blossom-sim.workspace = true
blossom-smt.workspace = true
blossom-sat.workspace = true
blossom-ldfi.workspace = true
blossom-verify.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true

# The corpus runner (BENCH-000, WP M5.2) and the Molly parity runner (WP M8.1) are libtest-mimic harnesses.
[[test]]
name = "corpus"
path = "tests/corpus.rs"
harness = false

[[test]]
name = "molly_parity"
path = "tests/molly_parity.rs"
harness = false

[lints]
workspace = true
