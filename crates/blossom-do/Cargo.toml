[package]
name = "blossom-do"
description = "A deployment's node as a Cloudflare Durable Object (docs/design/DURABLE-OBJECTS.md): the object host over a journaled key-value store, its program compiled from sources in memory, with a wasm-bindgen API for the Worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blossom-base.workspace = true
blossom-value.workspace = true
blossom-ir.workspace = true
blossom-artifact.workspace = true
blossom-front.workspace = true
blossom-driver.workspace = true
blossom-node.workspace = true
blossom-runtime.workspace = true
blossom-store.workspace = true
blossom-std-host.workspace = true
blossom-wire.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.114"

[lints]
workspace = true
