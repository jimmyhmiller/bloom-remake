# A Blossom app's server as a Durable Object, run locally (docs/design/DURABLE-OBJECTS.md):
#   scripts/build-do.sh polls && (cd do && npx wrangler dev --port 8787)
# then open http://localhost:8787/ in two tabs. `wrangler dev` runs workerd on this machine; nothing is deployed.
name = "blossom-object"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The page: the browser host and its engine (scripts/build-web.sh), copied by scripts/build-do.sh.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "OBJECTS"
class_name = "BlossomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlossomObject"]

# The node's WebAssembly, imported as a compiled module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
