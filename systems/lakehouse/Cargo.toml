[package]
name = "blossom-sys-lakehouse"
description = "Flagship system: FLAG-125–128: the replicated object store and the Lattice Lakehouse log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Programs live in `bls/`; `build.rs` (added by the implementing WP) compiles them through blossom-build. Generated
# code names only `blossom_engine::abi` and `blossom_wire::abi` (ARCHITECTURE §4.7). No normal dependency path may
# reach blossom-driver (ARCHITECTURE §1.3; `cargo run -p xtask -- check-layers`).
[dependencies]
blossom.workspace = true
blossom-base.workspace = true
blossom-engine.workspace = true
blossom-value.workspace = true
blossom-wire.workspace = true

[build-dependencies]
blossom-build.workspace = true

[dev-dependencies]
blossom-ldfi.workspace = true
blossom-sim.workspace = true
blossom-verify.workspace = true

[lints]
workspace = true
