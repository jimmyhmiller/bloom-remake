[package]
name = "xtask"
description = "Repository tasks: layer, sans-IO and code-registry checks, and the corpus, codegen, benchmark and release tooling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# xtask/Cargo.toml is owned by M1.1. A WP that owns an `xtask/src/cmd/*.rs` file and needs another dependency adds
# it here as a recorded out-of-scope fix (PLAN §2.7); see docs/dev/CONVENTIONS.md.
[dependencies]
blossom-base.workspace = true
blossom-value.workspace = true
blossom-artifact.workspace = true
blossom-analysis.workspace = true
blossom-front.workspace = true
blossom-driver.workspace = true
blossom-ir.workspace = true
blossom-oracle.workspace = true
blossom-sim.workspace = true
blossom-ldfi.workspace = true
blossom-node.workspace = true
blossom-engine.workspace = true
clap.workspace = true
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde.workspace = true
serde_json.workspace = true
syn = { version = "3.0.6", features = ["full", "visit", "extra-traits"] }
toml.workspace = true

[lints]
workspace = true
