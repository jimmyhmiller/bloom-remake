# BENCH-093 (R03 T28; R05 T12): CIDR'11 golden analysis of the destructive cart.
#
# CIDR §5.4, Figure 15: the key-value store's `<-` resurfaces in the full-program analysis; "there are points of order
# between action_msg, member, and the temporal cluster" and consistency would need coordination "for every client
# action or kvput update". FEATURES BENCH-093: "DestructiveCart has a point of order on every action."
#
# Here an action reads the session's cart (kvget -> getj -> kvget_response), writes the new value through cart_put
# and kvput, which deletes and re-inserts in kvstate at the next tick, and replicates it: kvstate, getj,
# kvget_response, old_state, cart_put, kvput, prev and the replication channel kv_replicate form one strongly
# connected component with negative and temporal edges (Figure 15's large octagon also holds the multicast
# relations). Every path from an action or a checkout to the reply crosses it.
schema = 1
id = "BENCH-093"
title = "CIDR'11 destructive cart: every action crosses the store's temporal cluster"
priority = "P0"
source = "R03 T28 and §5.3; R05 T12; CIDR 2011 Figures 5, 6, 13 and 15"
features = ["LANG-040", "LANG-041", "LANG-042", "LANG-043", "LANG-045", "LANG-047", "LANG-060", "LANG-061", "LANG-062", "LANG-063", "LANG-082", "LANG-150", "LANG-180", "LANG-190", "SEM-021", "ANA-022"]
program = "program.bls"
derived = false
expected_from = "literature"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-041", "LANG-042", "LANG-043", "LANG-045", "LANG-047", "LANG-060", "LANG-061", "LANG-062", "LANG-063", "LANG-082", "LANG-150", "LANG-180", "LANG-190", "SEM-021", "ANA-022"]
until = "M5"

[expect_analysis]
points_of_order = { complete = false, clusters = [["cart_put", "getj", "kv_replicate", "kvget_response", "kvput", "kvstate", "old_state", "prev"]], crossing = [{ from = "action_msg", to = "response_msg" }, { from = "checkout_msg", to = "response_msg" }] }
