# BENCH-082 (R02 T14; R05 T5): the marriage ceremony has an ultimate model without runaway().
#
# MAR Example 3: if the two vows are assigned the same first arrival tick, runaway() never holds. The spec claims
# runaway() always holds within 4 ticks; bounded model checking finds the run that delivers both vows in tick 1, so
# the check fails. Together with BENCH-082b this exhibits both ultimate models.
schema = 1
id = "BENCH-082"
title = "Marriage ceremony: some schedule never calls the wedding off (bounded model checking finds it)"
priority = "P0"
source = "R02 T14 and §7.2 (MAR Example 3, verbatim program)"
features = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-061", "LANG-062", "LANG-082", "LANG-201", "VER-001", "VER-002", "TEST-081"]
program = "program.bls"
spec = "spec.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [{ name = "N1", role = "Node" }]

[backend.bmc]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-061", "LANG-062", "LANG-082", "LANG-201", "VER-001", "VER-002", "TEST-081"]
until = "M9"

[expect_verify]
check = "bmc"
result = "fails"
bounds = { ticks = 6, delay = 2 }
