# BENCH-095 (R05 T20; §5.7, §5.9, §9.4 item 20): Edelweiss's reliable broadcast with epoch membership.
#
# R05 §9.4 item 20: "Reliable broadcast, epoch membership: no reclamation until seal_node_epoch(k). Then epoch-k entries
# delivered to all members are reclaimed. Adding a node to a new epoch never loses messages destined for it." R05 §5.7:
# "A punctuation 'no more node facts for epoch k' ... lets DR+ reclaim epoch-k messages delivered to all epoch-k members.
# Symmetrically, a seal on log.epoch lets it reclaim node entries." The artifact's rewrite
# (BroadcastEpochAll_rewrite_src.rb) reclaims log through `(log * seal_node_epoch).lefts(:epoch => :epoch).notin(
# r0_node_log_missing, ...)` and node through `(node * seal_log_epoch)...`.
#
# Scenario (synchronous rounds, so the seals can be issued after delivery): every node learns epoch 1 = {n1, n2} and
# epoch 2 = {n1, n2, n3} in tick 1; n1 originates messages 1 and 2 in epoch 1 (tick 1) and 3 and 4 in epoch 2 (tick 2).
# Every delivery and acknowledgement completes by tick 5. The host seals node epoch 1 at every node in tick 6 and log
# epoch 1 in tick 7. Without the rewrite n1 and n2 keep all four messages and n3, never a member of epoch 1, gets
# messages 3 and 4. In the rewritten program nothing is reclaimed before the seal (tick 5), the epoch-1 messages go
# once node epoch 1 is sealed, and the epoch-1 node entries once log epoch 1 is sealed; epoch 2 is never sealed.
schema = 1
id = "BENCH-095"
title = "Edelweiss epoch broadcast: epoch-1 messages reclaimed only after the node-epoch seal; the new member loses nothing"
priority = "P1"
source = "R05 T20, §5.7, §5.9, §9.4 item 20; Edelweiss (VLDB 2014) §4.2; artifact broadcast_epoch_all.rb, BroadcastEpochAll_rewrite_src.rb"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-060", "LANG-062", "LANG-207", "ANA-060", "ANA-061", "ANA-063", "ANA-065", "ANA-066", "DIST-007"]
program = "program.bls"
