# BENCH-087 (R02 T20): the `.ded` twin of BENCH-087a, through the Molly frontend (LANG-220).
#
# The input appears in tick 1 (the `@1` facts), the start vertices arrive in tick 2, so x, y and z are covered from
# tick 2 and w never. In ticks 0 and 1 no node is covered (in tick 0 `id` is still empty). Rows omit the location
# column.
schema = 1
id = "BENCH-087"
title = "TPLP Fig. 1 (covered, .ded twin): synchronous rounds cover x, y, z from tick 2 and never w"
priority = "P1"
source = "R02 T20; TPLP 2016 Figure 1 and Example 1 (verbatim program; Id added as in CRON Fig. 3)"
features = ["LANG-065", "LANG-069", "LANG-220"]
program = "program.ded"
derived = false
expected_from = "literature"

[deploy]
nodes = [
    { name = "x", role = "Node" },
    { name = "y", role = "Node" },
    { name = "z", role = "Node" },
    { name = "w", role = "Node" },
]

[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-065", "LANG-069", "LANG-220"]
until = "M5"

[[expect]]
node = "x"
rel = "covered"
row = []
holds = "2.."
absent = "..=1"

[[expect]]
node = "y"
rel = "covered"
row = []
holds = "2.."
absent = "..=1"

[[expect]]
node = "z"
rel = "covered"
row = []
holds = "2.."
absent = "..=1"

[[expect]]
node = "w"
rel = "covered"
row = []
absent = "0.."
