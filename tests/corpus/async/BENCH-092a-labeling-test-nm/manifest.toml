# test_labeler1: `Label.new("TestNM")` gives output_report {"response"=>"D"} and path_report {"response"=>{"i1"=>"A","i2"=>"D"}}; test_label1 reports a D flow.
# Path labels (R05 §3.2): an async edge is A, a non-monotone edge N, A followed by N is D, and an output takes the
# disjunction of its paths. Guarded asynchrony: two channel streams that meet are guarded only if both pass through
# persistent state or a lattice first; an unguarded meeting labels the meeting relation and its descendants D. A race
# is reported for the pair of channels, in either order.
