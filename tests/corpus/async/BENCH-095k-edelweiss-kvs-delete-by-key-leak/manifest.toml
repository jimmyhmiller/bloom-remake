# BENCH-095 (R05 T23; §5.8, §5.9, §9.4 item 23): the KVS that deletes by key leaks its deletions, as expected.
#
# R05 §5.9: "KVS with deletes by key (not insert id): deletions can never be reclaimed, and that is correct in principle."
# R05 §9.4 item 23: "Negative variant: deletes by key ⇒ deletions are never reclaimed (expected leak)." DR- needs the
# negation to match exactly the keys of the positive input (R05 §5.8: "the negation qual columns on X [must be] exactly
# X's key columns"); here it matches key, not ins_log's key id, so a delete may always have to hide a later insert of the
# same key. Inserts whose key is deleted are still reclaimed once delivered to every replica (DR+ with the membership
# seal).
#
# Scenario: n1 inserts 1 (k1 = a) and 2 (k2 = b) at tick 1; n2 deletes key k1 (delete id 11) at tick 3; 32 seeded schedules
# over the default lossy channels, bounded by ticks. Every replica's view ends as {2: k2 = b}. In the rewritten program
# every replica keeps insert 2 and the delete of k1 forever (ANA-066: leak rather than lose).
schema = 1
id = "BENCH-095"
title = "Edelweiss KVS deleting by key: the view converges; deletions are never reclaimed (the expected leak)"
priority = "P1"
source = "R05 T23, §5.8, §5.9, §9.4 item 23; Edelweiss (VLDB 2014) §8; artifact kvs.rb (comment on Wuu and Bernstein)"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-082", "LANG-083", "SEM-040", "SEM-073", "TEST-001", "ANA-060", "ANA-061", "ANA-062", "ANA-063", "ANA-064", "ANA-066", "DIST-007"]
program = "program.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [{ name = "n1", role = "Node" }, { name = "n2", role = "Node" }, { name = "n3", role = "Node" }]

[run]
ticks = 40
stop = "ticks"
seeds = 32

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-082", "LANG-083", "SEM-040", "SEM-073", "TEST-001", "ANA-060", "ANA-061", "ANA-062", "ANA-063", "ANA-064", "ANA-066", "DIST-007"]
until = "M7"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-082", "LANG-083", "SEM-040", "SEM-073", "TEST-001", "ANA-060", "ANA-061", "ANA-062", "ANA-063", "ANA-064", "ANA-066", "DIST-007"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "put"
rows = [[1, "k1", "a"], [2, "k2", "b"]]

[[input]]
node = "n2"
tick = 3
rel = "remove_key"
rows = [[11, "k1"]]

[[expect]]
node = "n1"
rel = "view"
final = true
rows = [[2, "k2", "b"]]

[[expect]]
node = "n2"
rel = "view"
final = true
rows = [[2, "k2", "b"]]

[[expect]]
node = "n3"
rel = "view"
final = true
rows = [[2, "k2", "b"]]

[expect_analysis.reclaimable]
reclaimed = { ins_log = "join_seal" }
kept = { del_log = "quals_not_positive_keys" }
channels = { ins_chn = "arm", del_chn = "arm" }

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "ins_log"
final = true
rows = [[2, "k2", "b"]]

[[expect_analysis.reclaimable.storage]]
node = "n2"
rel = "ins_log"
final = true
rows = [[2, "k2", "b"]]

[[expect_analysis.reclaimable.storage]]
node = "n3"
rel = "ins_log"
final = true
rows = [[2, "k2", "b"]]

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "del_log"
final = true
rows = [[11, "k1"]]

[[expect_analysis.reclaimable.storage]]
node = "n2"
rel = "del_log"
final = true
rows = [[11, "k1"]]

[[expect_analysis.reclaimable.storage]]
node = "n3"
rel = "del_log"
final = true
rows = [[11, "k1"]]
