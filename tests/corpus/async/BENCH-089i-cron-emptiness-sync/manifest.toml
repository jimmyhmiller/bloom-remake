# BENCH-089 (R02 T26): CRON Figure 3, the emptiness query, under the sync harness, S empty everywhere.
#
# Derivation: every node sends its identifier to every node in tick 0 (and in every tick after); in tick 1 each node
# holds all three identifiers, so missing() is false and T() holds from tick 1 on. In tick 0 no identifier has
# arrived, so no node outputs T().
schema = 1
id = "BENCH-089"
title = "CRON Fig. 3 (emptiness): synchronous rounds output T() everywhere from tick 1 when S is empty"
priority = "P1"
source = "R02 T26; CRON (JCSS 2014) Figure 3 and §6.1.1 (verbatim program)"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-047", "LANG-060", "LANG-062", "LANG-082", "LANG-190", "LANG-240"]
program = "program.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [{ name = "x", role = "Node" }, { name = "y", role = "Node" }, { name = "z", role = "Node" }]

[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-047", "LANG-060", "LANG-062", "LANG-082", "LANG-190", "LANG-240"]
until = "M5"

[[expect]]
node = "x"
rel = "t"
row = []
holds = "1.."
absent = "0"

[[expect]]
node = "y"
rel = "t"
row = []
holds = "1.."
absent = "0"

[[expect]]
node = "z"
rel = "t"
row = []
holds = "1.."
absent = "0"
