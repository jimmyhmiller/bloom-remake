# BENCH-097 (R13 §12 T6; FT §4.1, §5.1): (b) non-monotone queries that terminate freely on some inputs.
#
# R13 T6: "q() :- R(c), notin S(c) with R and S persisted: q is provisional-true after R(c), and final-false once S(c)
# arrives." FT §5.1: for Q(x) = (R(x) ∧ x > 10) ∨ (S(x) ∧ ¬T(x)) with inputs R(20), S(5), T(5), "(20) is final-present,
# and (5) is final-absent, because both disjuncts are refuted: 5 > 10 is false and T(5) is present"; with S(7) only,
# "(7) is provisional-present". Both queries are MIXED (ANA-120): decided per tuple at run time (ANA-121).
#
# Inputs (each stored in an insert-only table): tick 1 R(1), R(20), S(5), T(5); tick 2 S(7); tick 3 S(1).
schema = 1
id = "BENCH-097"
title = "Free termination (b): R(c) ∧ ¬S(c) turns final-false; FT §5.1's Q is final per tuple"
priority = "P0"
source = "R13 §12 T6; FT (ICDT 2025) §4.1 and §5.1"
features = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-082", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 12
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-082", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
until = "M6"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-082", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
until = "M7"


[[input]]
node = "n1"
tick = 1
rel = "r_in"
rows = [[1], [20]]

[[input]]
node = "n1"
tick = 1
rel = "s_in"
rows = [[5]]

[[input]]
node = "n1"
tick = 1
rel = "t_in"
rows = [[5]]

[[input]]
node = "n1"
tick = 2
rel = "s_in"
rows = [[7]]

[[input]]
node = "n1"
tick = 3
rel = "s_in"
rows = [[1]]

[[expect]]
node = "n1"
rel = "q"
row = [20]
holds = "1.."
absent = "0"

[[expect]]
node = "n1"
rel = "q_final_present"
row = [20]
holds = "1.."
absent = "0"

[[expect]]
node = "n1"
rel = "q"
row = [5]
absent = "0.."

[[expect]]
node = "n1"
rel = "q_final_absent"
row = [5]
holds = "1.."
absent = "0"

[[expect]]
node = "n1"
rel = "q"
row = [7]
holds = "2.."
absent = "..=1"

[[expect]]
node = "n1"
rel = "q_final_present"
row = [7]
absent = "0.."

[[expect]]
node = "n1"
rel = "q_final_absent"
row = [7]
absent = "0.."

[[expect]]
node = "n1"
rel = "q_c"
row = []
holds = "1..=2"
