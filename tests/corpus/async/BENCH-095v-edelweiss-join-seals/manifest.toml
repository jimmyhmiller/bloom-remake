# BENCH-095 (R05 T26; §5.7): bud-gc's JoinReclaim unit tests where reclamation waits on seals (ANA-063, ANA-065).
#
# R05 §5.7 ("Seal dependencies for other joins", is_safe_rhs_ref): "If X is also joined, in a rule that is not itself an
# RSE target, with Z (t1 <= (Z * X)...), reclamation of X is chained behind one of: (a) a whole-relation seal on Z; (b) a
# seal on Z's join column (seal_Z_<col>), matched on the predicate; ... Multiple seal dependencies are chained." Here the
# reclaimed relation t3 is the positive input of a negation and also joined with t2 (and t4).
#
# Fixtures (bud-gc test/tc_gc.rb), each ported with prefixed relation names:
# - ws: JoinReclaimWithSeal, test_join_reclaim_with_seal.
# - wsr: JoinReclaimWithSealReorder, test_join_reclaim_with_seal_reorder.
# - mpa: JoinReclaimMultiplePreds, test_join_reclaim_multi_preds (the seal on t2.a).
#   Bud seals t2 on a and on b; one seal key per relation, so the test is split over mpa (a) and mpb (b).
# - mpb: JoinReclaimMultiplePreds, test_join_reclaim_multi_preds (the seal on t2.b).
# - isx: JoinReclaimIntersectSeal, test_join_reclaim_intersect.
#   Bud's whole-relation seals of t2 and t4 at the last step become seals on val 11 (one seal key per relation).
