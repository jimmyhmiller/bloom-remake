# BENCH-095 (R05 T25; §5.9, §9.4 item 25): Edelweiss's atomic snapshot reads: snapshots reclaimed after read_commit.
#
# R05 §5.9: "Atomic snapshot reads (§7.3) | 8 -> 23 | read once in snapshot_exists; snapshot once its batch is in
# read_commit." R05 §9.4 item 25: "Snapshots are reclaimed after read_commit." The artifact's rewrite
# (AtomicReads_rewrite_src.rb): `read < -(read * snapshot_exists).lefts(:batch => :batch)` and `snapshot < -(snapshot *
# read_commit).lefts(:effective => :batch)`, with the batch-write reclamation of BENCH-095 (i).
#
# Scenario (one node, synchronous rounds): the batches of BENCH-095 (i); read 100 starts at tick 7 and is committed at
# tick 10. The snapshot, taken in tick 7 and stored from tick 8, holds the live writes 2 and 3; it is visible until the
# commit. In the rewritten program read and snapshot end empty, as do write and commit.
schema = 1
id = "BENCH-095"
title = "Edelweiss atomic reads: a read sees one consistent snapshot until committed; reads and snapshots reclaimed"
priority = "P1"
source = "R05 T25, §5.9, §9.4 item 25; Edelweiss (VLDB 2014) §7.3; artifact atomic_reads.rb, AtomicReads_rewrite_src.rb"
features = ["LANG-025", "LANG-040", "LANG-043", "LANG-047", "LANG-050", "LANG-060", "LANG-061", "LANG-082", "LANG-087", "LANG-207", "ANA-060", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 13
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-025", "LANG-040", "LANG-043", "LANG-047", "LANG-050", "LANG-060", "LANG-061", "LANG-082", "LANG-087", "LANG-207", "ANA-060", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066"]
until = "M7"

[backend.analysis]
