# BENCH-097 (R13 §12 T8; FT §4.2, App. B; SEM-017): (d) `pn.value >= 10` is never final; `pn.pos >= 10` is.
#
# R13 T8: "PN-counter with increments to 12 and no decrements yet. pn.value >= 10 must not be final: ANA-120 =
# NEVER-FINAL, and the runtime keeps it provisional. pn.pos >= 10 is final-true at the 10th increment. A later
# decrement to 9 must flip value >= 10 back to false."
#
# Inputs: increment i in tick i for i = 1..12; decrements in ticks 13, 14 and 15. The value is 10 in tick 10, 12 in
# tick 12, then 11, 10 and 9: value >= 10 holds in ticks 10-14 and never as final; pos >= 10 holds, and is final,
# from tick 10.
schema = 1
id = "BENCH-097"
title = "Free termination (d): the PN-counter's value threshold is never final, its pos threshold is"
priority = "P0"
source = "R13 §12 T8; FT (ICDT 2025) §4.2 and Appendix B; SEM-017"
features = ["LANG-043", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-127", "LANG-128", "LANG-212", "ANA-120", "ANA-121", "SEM-016", "SEM-017"]
program = "program.bls"
derived = false
expected_from = "literature"

