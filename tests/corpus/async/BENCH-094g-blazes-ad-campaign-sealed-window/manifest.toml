# BENCH-094 (R05 T14): CAMPAIGN over a click stream sealed on window: the seal is incompatible, so it diverges.
#
# R05 §4.4.2: "Negative test (not in the paper, follows from the rules): CAMPAIGN with Seal_window ⇒ not compatible ⇒
# Diverge." Blazes §4.2.1: "an input stream sealed on campaign is only compatible with the query CAMPAIGN—all other
# queries combine the results from multiple campaigns"; symmetrically, CAMPAIGN combines windows. compatible({campaign,
# id}, {window}) fails (window determines neither campaign nor id), so NDRead_{campaign,id} is unprotected: Rep ⇒ Inst
# at `report`, rule 3 ⇒ Taint at `cache`, Rep ⇒ Diverge. The seal buys nothing; ordering is required.
#
# Annotations (ANA-040, white box; Blazes §5.2.1): `report` logs clicks (click -> response: CW, the click only writes
# the log the query reads) and answers requests (request -> response: OR_campaign,id); `cache` reads its store and
# forwards (request -> answer, request -> forward: CR) and stores answers (response -> answer/share, peer -> answer:
# CW). Both components are replicated (`#[replicated]` on their output streams). The only cycle is the cache's self-edge
# through `share`: "Cache and Report form no cycle, because Cache provides no path from r to q" (Blazes §4.2).
schema = 1
id = "BENCH-094"
title = "Blazes, ad reporting with CAMPAIGN and clicks sealed on window: incompatible seal, the sink Diverges"
priority = "P1"
source = "R05 T14, §4.4.1, §4.4.2 (reference derivations) and §9.3 item 14; Blazes (ICDE 2014) §1.3, §3.4, §4, §5.2, §7"
features = ["LANG-003", "LANG-004", "LANG-009", "LANG-040", "LANG-042", "LANG-043", "LANG-060", "LANG-062", "LANG-088", "LANG-153", "ANA-040", "ANA-041", "ANA-042", "ANA-045", "LANG-047", "LANG-100", "LANG-207", "ANA-043"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = "The Bloom ad-reporting source (~125 LOC) is not published; the program is re-derived from the paper's description and Fig. 5 queries."

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-003", "LANG-004", "LANG-009", "LANG-040", "LANG-042", "LANG-043", "LANG-060", "LANG-062", "LANG-088", "LANG-153", "ANA-040", "ANA-041", "ANA-042", "ANA-045", "LANG-047", "LANG-100", "LANG-207", "ANA-043"]
until = "M7"

[expect_analysis.blazes]
cycles = [["cache"]]
streams = { click = "Seal(window)", ask = "Async", lookup = "Async", found = "Inst", share = "Diverge", result = "Diverge" }
sinks = { answers = "Diverge" }
coordination = [{ at = "report", mechanism = "ordering" }]

[[expect_analysis.blazes.paths]]
component = "report"
from = "click"
to = "response"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "report"
from = "request"
to = "response"
annotation = "OR"
gate = ["campaign", "id"]

[[expect_analysis.blazes.paths]]
component = "cache"
from = "request"
to = "forward"
annotation = "CR"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "request"
to = "answer"
annotation = "CR"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "response"
to = "answer"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "response"
to = "share"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "peer"
to = "answer"
annotation = "CW"
