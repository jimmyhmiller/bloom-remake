# BENCH-093 (R03 T30; R05 T12): with BestEffortMulticast and StaticMembership mixed in, ReplicatedKVS is fully
# specified.
#
# R03 T30: "With BestEffortMulticast StaticMembership mixed in, it does not [warn]." The multicast now reads mcast_send
# and supplies mcast_done and pipe_out, so a put reaches the store and the store's reply: the dataflow from kvput to
# kvget_response exists. Its path label is D: the replicated path is asynchronous and then crosses the upsert (and
# the per-key choice), A followed by N (ANA-023).
