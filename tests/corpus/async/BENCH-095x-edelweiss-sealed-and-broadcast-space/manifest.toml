# BENCH-095 (R05 T26, T18-T19; §5.4, §5.6): bud-gc's SealedCollection and ReliableBroadcast space tests.
#
# tc_gc.rb test_simple: after one tick "foo" and "baz" are [[5, 10], [6, 12]]. test_space_basic: three nodes with
# `sealed :node` holding all three addresses; the first node logs messages 0..100 in shuffled order, one per tick, with
# every node ticking; after ten more rounds "assert_equal(3, r.chn_approx.physical_size)" at every node. R05 §5.6: "for
# unicast, chn_approx compresses to a single [k, n], a logical clock. For broadcast, you get one clock per node, a vector
# clock." Every node forwards its log to every node (itself included), so each node's approximation of delivered
# (addr, id) keys is three ranges, [0-100] per destination. The program is the artifact's broadcast_all.rb, whose
# published rewrite (BroadcastAll_rewrite_src.rb) also reclaims log entries once delivered to every node of the sealed
# membership: `log <- (log * seal_node).lefts.notin(r0_node_log_missing, ...)`. No output reads the log, so in the
# rewritten program every node's log ends empty; without the rewrite it keeps all 101 messages.
#
# Port: messages go in at n1 in the fixed permutation below (Bud shuffles at random; the order is irrelevant to the
# result), one per tick from tick 1; every node ticks every round. `ranges` pins the buckets of the ARM approximation
# of rb_chn at each node in the rewritten program, as [addr, lo, hi].
schema = 1
id = "BENCH-095"
title = "Edelweiss sealed collection and broadcast space (tc_gc.rb): ARM plus range compression leave one range per node"
priority = "P1"
source = "R05 T18-T19, T26, §5.4, §5.6; bud-gc test/tc_gc.rb (TestSealed, TestReliableDelivery); Edelweiss (VLDB 2014) §3.1, §3.3"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-049", "LANG-050", "LANG-060", "LANG-062", "LANG-094", "LANG-190", "ANA-060", "ANA-061", "ANA-066", "DIST-007"]
program = "program.bls"
derived = false
expected_from = "literature"
notes = "The shuffled insertion order is fixed (seed 1234) so the case is deterministic; see docs/plan/notes/M1.4.md (BENCH-095)."

[deploy]
nodes = [{ name = "n1", role = "Node" }, { name = "n2", role = "Node" }, { name = "n3", role = "Node" }]

[run]
ticks = 113
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-049", "LANG-050", "LANG-060", "LANG-062", "LANG-094", "LANG-190", "ANA-060", "ANA-061", "ANA-066", "DIST-007"]
