# BENCH-082 (R02 T15; R05 T5): the Dedalus+ marriage ceremony (MAR Example 4) is certified.
#
# MAR Example 4 pushes the negation down to the EDB relation i_do_edb and persists the asynchronous head i_dont, so
# the program is semipositive with guarded asynchrony: Dedalus+, confluent by MAR Theorem 1 (one ultimate model for
# every EDB instance, hence the same output in every fair run). R02 T15: "Exactly one UM on every schedule. The
# analyzer must certify it as Dedalus+."
#
# Analysis: the only negative edge is the negation of the EDB relation i_do_edb in `refuse`, whose head is the send of
# i_dont_msg. Oracle: both parties vow, so no refusal is ever sent; nothing changes after the boot tick, and runaway
# never holds (quiescent from tick 1).
schema = 1
id = "BENCH-082"
title = "Marriage ceremony in Dedalus+ (MAR Example 4): certified confluent"
priority = "P0"
source = "R02 T15 and §7.3 (MAR Example 4, verbatim rules); R05 T5"
features = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-061", "LANG-062", "LANG-082", "LANG-190", "SEM-021", "ANA-022", "ANA-025", "ANA-029"]
program = "program.bls"
derived = false
expected_from = "literature"
notes = "The `party` domain relation is added so that MAR's first rule is range-restricted; see program.bls."

[run]
ticks = 6
stop = "quiescent"

[backend.oracle]
status = "pass"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-061", "LANG-062", "LANG-082", "LANG-190", "SEM-021", "ANA-022", "ANA-025", "ANA-029"]
until = "M7"

[[expect]]
node = "n1"
rel = "runaway"
row = []
absent = "0.."

[[expect]]
node = "n1"
rel = "i_dont"
final = true
rows = []

[[expect]]
quiescent_from = 1

[expect_analysis]
points_of_order = { complete = true, edges = [{ from = "i_do_edb", to = "i_dont_msg", kind = "negation" }], clusters = [] }
certificates = { runaway = ["dedalus_plus"] }
confluent = { runaway = "certified" }
fair_consistency = { runaway = "certified" }
