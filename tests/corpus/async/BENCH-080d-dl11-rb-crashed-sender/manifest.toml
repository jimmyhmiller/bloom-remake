# BENCH-080 (R02 T12): the `.ded` twin of BENCH-080a, through the Molly frontend (LANG-220).
#
# Same scenario and derivation as BENCH-080a: a broadcasts "m1" in tick 1 (the `rmessage(...)@1` fact), the message
# a -> c sent in tick 1 is omitted, a crashes in tick 2. The frontend strips the location column (ARCHITECTURE
# §13.12), so rows below are (Sender, Message). b and d deliver from tick 3, c from tick 4, a never. The crash
# follows CR-20 (no firings from the crash tick on); Molly's "crashed nodes keep computing" view is LDFI-only.
schema = 1
id = "BENCH-080"
title = "DL11 reliable broadcast (.ded twin): every non-failed node delivers when the sender crashes mid-broadcast"
priority = "P1"
source = "R02 T12 and §4.7 (DL11 §5.7, verbatim program)"
features = ["LANG-065", "LANG-069", "LANG-220", "SEM-007"]
program = "program.ded"
derived = false
expected_from = "literature"

[deploy]
nodes = [
    { name = "a", role = "Node" },
    { name = "b", role = "Node" },
    { name = "c", role = "Node" },
    { name = "d", role = "Node" },
]

[run]
ticks = 10
stop = "ticks"

[[fault]]
kind = "omit"
from = "a"
to = "c"
send_tick = 1

[[fault]]
kind = "crash"
node = "a"
tick = 2

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-065", "LANG-069", "LANG-220", "SEM-007"]
until = "M5"

[[expect]]
node = "c"
rel = "sbcast"
tick = 2
rows = []

[[expect]]
node = "c"
rel = "sbcast"
tick = 3
rows = [["a", "m1"]]

[[expect]]
node = "b"
rel = "rdeliver"
row = ["a", "m1"]
holds = "3.."
absent = "..=2"

[[expect]]
node = "d"
rel = "rdeliver"
row = ["a", "m1"]
holds = "3.."
absent = "..=2"

[[expect]]
node = "c"
rel = "rdeliver"
row = ["a", "m1"]
holds = "4.."
absent = "..=3"

[[expect]]
node = "a"
rel = "rdeliver"
row = ["a", "m1"]
absent = "0.."
