rows = [[104, "m104"], [105, "m105"]]

[[input]]
node = "n3"
tick = 1
rel = "originate"
rows = [[201, "m201"], [202, "m202"], [203, "m203"]]

[[input]]
node = "n3"
tick = 2
rel = "originate"
rows = [[204, "m204"], [205, "m205"]]

[[expect]]
