# BENCH-090 (R05 T10): "Threshold queries return a final result early"; A − R is flagged non-monotone.
#
# Keep CALM and CRDT On (VLDB 2023), Example 2: |{txn : GIFTCARD ∧ amount > 100}| > 50 and, on a two-phase set,
# |A| + |R| > 100 may return a final true early; A − R ("potato and Ferrari") cannot be answered locally. The
# thresholds are scaled to 2 and 3 here.
#
# Inputs (each arrives in its tick; `emit` into a cell merges now):
#   tick 1  txn 1 (giftcard, 150), txn 2 (giftcard, 50); add potato
#   tick 2  txn 3 (giftcard, 200); add ferrari
#   tick 3  txn 4 (giftcard, 300); remove potato
#   tick 4  txn 5 (giftcard, 120); add salt
# Qualifying gift cards: 1 (tick 1), 3 (tick 2), 4 (tick 3): more than 2 from tick 3, and final at once (THRESH-final,
# ANA-120); txn 5 changes nothing. |A| + |R|: 1, 2, 3, 4, so busy (and final) from tick 4. A − R: {potato},
# {potato, ferrari}, {ferrari}, {ferrari, salt}: potato is withdrawn in tick 3, so in_cart is not monotone.
schema = 1
id = "BENCH-090"
title = "CALM oracle: lattice threshold queries are final as soon as they hold; A − R is a point of order"
priority = "P1"
source = "R05 T10 and §2.6; Laddad et al., Keep CALM and CRDT On (VLDB 2023) Example 2"
features = ["LANG-043", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-020", "ANA-022", "ANA-120", "ANA-121"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = "Thresholds scaled from 50 and 100 to 2 and 3; the program is written from the paper's queries."

[run]
ticks = 6
stop = "quiescent"

[[input]]
node = "n1"
tick = 1
rel = "txn"
rows = [[1, "giftcard", 150], [2, "giftcard", 50]]

[[input]]
node = "n1"
tick = 2
rel = "txn"
rows = [[3, "giftcard", 200]]

[[input]]
node = "n1"
tick = 3
rel = "txn"
rows = [[4, "giftcard", 300]]

[[input]]
node = "n1"
tick = 4
rel = "txn"
rows = [[5, "giftcard", 120]]

[[input]]
node = "n1"
tick = 1
rel = "add"
rows = [["potato"]]

[[input]]
node = "n1"
tick = 2
rel = "add"
rows = [["ferrari"]]

[[input]]
node = "n1"
tick = 3
rel = "remove"
rows = [["potato"]]

[[input]]
node = "n1"
tick = 4
rel = "add"
rows = [["salt"]]

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-020", "ANA-022", "ANA-120", "ANA-121"]
until = "M6"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-020", "ANA-022", "ANA-120", "ANA-121"]
until = "M7"

[[expect]]
node = "n1"
rel = "big_gift_cards"
row = []
holds = "3.."
absent = "..=2"

[[expect]]
node = "n1"
rel = "gift_final"
row = []
holds = "3.."
absent = "..=2"

[[expect]]
node = "n1"
rel = "busy"
row = []
holds = "4.."
absent = "..=3"

[[expect]]
node = "n1"
rel = "busy_final"
row = []
holds = "4.."
absent = "..=3"

[[expect]]
node = "n1"
rel = "in_cart"
row = ["potato"]
holds = "1..=2"
absent = "3.."

[[expect]]
node = "n1"
rel = "in_cart"
tick = 4
rows = [["ferrari"], ["salt"]]

[expect_analysis]
points_of_order = { complete = true, edges = [{ from = "removes", to = "in_cart", kind = "lattice_op" }], clusters = [] }
finality = { big_gift_cards = ["THRESH"], busy = ["THRESH"] }
