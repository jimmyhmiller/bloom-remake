# BENCH-093 (R03 T30; R05 T12): ReplicatedKVS reports underspecification until multicast and membership are mixed in.
#
# CIDR §4.5 and Figure 9 mark a dataflow with no implementation as underspecified ("??"); R03 T30: "ReplicatedKVS
# alone warns my_id, add_member, send_mcast (input) and mcast_done (output) as underspecified". ANA-008 reports
# relations nobody reads, outputs nobody writes and rules that can never fire as BLS1002. Here `mcast_send` is written
# and never read, and `add_member` is never read, so the analysis warns (at least one BLS1002; the exact set depends
# on how ANA-008 groups its reports, see docs/plan/notes/M1.4.md).
