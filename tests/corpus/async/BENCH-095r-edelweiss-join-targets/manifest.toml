# BENCH-095 (R05 T26; §5.7): bud-gc's JoinRse unit tests for shared join inputs and target lists (ANA-063).
#
# R05 §5.7: a join input is reclaimed once the other input is sealed and no join result involving it is missing; with a
# pull-up, "if the notin quals reference only columns derived from A ... a simple rule is added: del_A_r <= (A *
# Y).lefts(pulled-up quals). It needs no seal". A relation that is an input of several reclamation rules is reclaimed
# only when all of them allow it. Constants in the target list (literals, the node's address and port) are part of the
# join result the negation is matched against.
#
# Fixtures (bud-gc test/tc_gc.rb), each ported with prefixed relation names:
# - sut: JoinRseSealedUseTwice, test_rse_join_sealed_twice.
# - ut: JoinRseUseTwice, test_rse_join_twice.
# - dr: JoinRseSealDoubleReclaim, test_rse_join_twice_reclaim_from_sealed.
# - ds: JoinRseDoubleScratch, test_rse_join_double_scratch.
# - tc: JoinRseTlistConst, test_rse_join_tlist_const.
#   Bud's constant 99 shares a column with the string "foo"; the port writes "99".
# - ip: JoinRseTlistIpPort, test_rse_join_tlist_ip_port.
# - cq: JoinRseTlistConstQual, test_rse_join_tlist_const_qual.
schema = 1
id = "BENCH-095"
title = "Edelweiss join reclamation (tc_gc.rb): sealed inputs used twice, double reclaim, double scratch, constant target lists"
priority = "P1"
source = "R05 T26, §5.4-§5.8, §9.4 item 26; bud-gc test/tc_gc.rb (Edelweiss prototype, VLDB 2014)"
