# BENCH-097 (R13 §12 T9; FT App. B): (e) a two-phase set is final-absent only.
#
# R13 T9: "Insert a, b; delete b. 'b ∈ set' is final-absent. 'a ∈ set' is provisional-present forever ('never
# positively')." FT Appendix B: the 2P-set can "negatively partially freely terminate on any value in DELETES", but
# never positively. Inputs: a and b inserted in tick 1, b deleted in tick 2.
schema = 1
id = "BENCH-097"
title = "Free termination (e): a 2P-set membership is final-absent once deleted and never final-present"
priority = "P0"
source = "R13 §12 T9; FT (ICDT 2025) Appendix B (Two-Phase Set CRDT)"
features = ["LANG-043", "LANG-090", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 12
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-090", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
until = "M6"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-090", "LANG-120", "LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-128", "LANG-212", "ANA-120", "ANA-121", "SEM-016"]
until = "M7"


[[input]]
node = "n1"
tick = 1
rel = "ins"
rows = [["a"], ["b"]]

[[input]]
node = "n1"
tick = 2
rel = "del"
rows = [["b"]]

[[expect]]
node = "n1"
rel = "in_set"
row = ["a"]
holds = "1.."
absent = "0"

[[expect]]
node = "n1"
rel = "in_set"
row = ["b"]
holds = "1"
absent = "2.."

[[expect]]
node = "n1"
rel = "final_absent"
row = ["b"]
holds = "2.."
absent = "..=1"

[[expect]]
node = "n1"
rel = "final_absent"
row = ["a"]
absent = "0.."

[[expect]]
node = "n1"
rel = "final_present"
row = ["a"]
absent = "0.."

[[expect]]
node = "n1"
rel = "final_present"
row = ["b"]
absent = "0.."

[expect_analysis]
finality = { in_set = ["MIXED"] }
