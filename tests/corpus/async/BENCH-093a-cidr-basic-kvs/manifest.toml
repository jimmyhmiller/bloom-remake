# BENCH-093 (R03 T28; R05 T12): CIDR'11 golden analysis of BasicKVS.
#
# CIDR §4.5, Figure 10: "kvstate and prev are collapsed into a red octagon because they are part of a strongly
# connected component in the graph with both negative and temporal edges. Any data flowing from kvput to the sink
# must cross at least one non-monotonic point of order ... and any path from kvget to the sink must join state
# potentially affected by non-monotonicity." R03 T28: "BasicKVS must show the temporal cluster {kvstate, prev} with
# points of order on every path from kvput."
#
# The only negative edge is the deletion prev -> kvstate (`delete`, at the next tick). kvstate -> prev is a same-tick
# edge, so {kvstate, prev} is a strongly connected component with a negative and a temporal edge: a temporal cluster.
# Every edge incident to a temporal cluster is a point of order (CIDR §4.4), so both paths to kvget_response cross one.
schema = 1
id = "BENCH-093"
title = "CIDR'11 BasicKVS: the temporal cluster {kvstate, prev}, crossed by every path to the output"
priority = "P0"
source = "R03 T28 and §5.3; R05 T12; CIDR 2011 Figures 4, 5 and 10"
features = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-063", "SEM-021", "ANA-022"]
program = "program.bls"
derived = false
expected_from = "literature"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-063", "SEM-021", "ANA-022"]
until = "M5"

[expect_analysis]
points_of_order = { complete = true, edges = [{ from = "prev", to = "kvstate", kind = "deletion" }], clusters = [["kvstate", "prev"]], crossing = [{ from = "kvput", to = "kvget_response" }, { from = "kvget", to = "kvget_response" }] }
