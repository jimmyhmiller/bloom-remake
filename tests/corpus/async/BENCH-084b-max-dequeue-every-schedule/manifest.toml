# BENCH-084 (R02 T17): "a schedule explorer should find only one UM" for the max-element dequeue.
#
# Same program and inputs as BENCH-084a (x contributes 1 and 3, y contributes 2, each sent once). Whatever the
# arrival order, the least of any two elements present is eventually dequeued and the greatest never is, so in every
# seed both nodes end holding exactly 3 (MAR Appendix E).
schema = 1
id = "BENCH-084"
title = "Max-element dequeue: every schedule leaves exactly the maximum at every node"
priority = "P1"
source = "R02 T17 and §7.3 (MAR Appendix E, Example 10, verbatim rules; elements sent once, see BENCH-084a)"
features = ["LANG-041", "LANG-042", "LANG-043", "LANG-047", "LANG-061", "LANG-062", "LANG-065", "LANG-082", "LANG-240", "SEM-040", "SEM-044", "TEST-001"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = "Elements are sent once (a host input); see BENCH-084a."

[deploy]
nodes = [{ name = "x", role = "Node" }, { name = "y", role = "Node" }]

[run]
ticks = 40
stop = "quiescent"
seeds = 32

[[input]]
node = "x"
tick = 1
rel = "b_edb"
rows = [[1], [3]]

[[input]]
node = "y"
tick = 1
rel = "b_edb"
rows = [[2]]

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-041", "LANG-042", "LANG-043", "LANG-047", "LANG-061", "LANG-062", "LANG-065", "LANG-082", "LANG-240", "SEM-040", "SEM-044", "TEST-001"]
until = "M8"

[[expect]]
node = "x"
rel = "b"
final = true
rows = [[3]]

[[expect]]
node = "y"
rel = "b"
final = true
rows = [[3]]
