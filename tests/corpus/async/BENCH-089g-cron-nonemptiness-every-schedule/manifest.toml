# BENCH-089 (R02 T27): CRON Figure 4 in every causal schedule.
#
# CRON §6.1.2: "The program is consistent." Under causal delivery (SEM-040, SEM-041) the single B() is sent after A()
# has arrived and been stored, and arrives later still, so it always pairs with the stored A(): T() holds at the end
# of every seed. (It "does not tolerate non-causality": a B() delivered into the past would be lost, which the
# simulator's causal semantics never does.)
schema = 1
id = "BENCH-089"
title = "CRON Fig. 4 (non-emptiness, B() once): every causal schedule produces T()"
priority = "P1"
source = "R02 T27; CRON (JCSS 2014) Figure 4 and §6.1.2 (verbatim program)"
features = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-061", "LANG-062", "LANG-082", "LANG-190", "LANG-240", "SEM-040", "SEM-041", "SEM-044", "TEST-001"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 30
stop = "ticks"
seeds = 32

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-061", "LANG-062", "LANG-082", "LANG-190", "LANG-240", "SEM-040", "SEM-041", "SEM-044", "TEST-001"]
until = "M8"

[[expect]]
node = "n1"
rel = "t"
final = true
rows = [[]]
