# BENCH-085 (R02 T18): the `.ded` twin of BENCH-085a, through the Molly frontend (LANG-220).
#
# q appears in tick 1, so both messages are sent in tick 1 (r holds from tick 2) and arrive together in tick 2:
# concurrent holds from tick 2 on. Rows omit the location column. The analysis verdicts are BENCH-085a's.
schema = 1
id = "BENCH-085"
title = "Concurrent arrival (.ded twin): diffluent; the synchronous schedule delivers both messages together"
priority = "P1"
source = "R02 T18 and §11 (MAR Appendix F, Example 11, verbatim program)"
features = ["LANG-065", "LANG-069", "LANG-220", "SEM-021", "ANA-022", "ANA-023", "ANA-024", "ANA-025", "ANA-029"]
program = "program.ded"
derived = false
expected_from = "literature"

[run]
ticks = 8
stop = "quiescent"

[backend.oracle]
status = "pass"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-065", "LANG-069", "LANG-220", "SEM-021", "ANA-022", "ANA-023", "ANA-024", "ANA-025", "ANA-029"]
until = "M7"

[[expect]]
node = "n1"
rel = "p"
tick = 2
rows = [["c1"], ["c2"]]

[[expect]]
node = "n1"
rel = "concurrent"
row = []
holds = "2.."
absent = "..=1"

[expect_analysis]
points_of_order = { complete = true, edges = [{ from = "r", to = "p", kind = "negation" }], clusters = [] }
calm_labels = { outputs = { concurrent = "D" } }
certificates = { concurrent = [] }
confluent = { concurrent = "not_confluent" }
fair_consistency = { concurrent = "not_certified" }
