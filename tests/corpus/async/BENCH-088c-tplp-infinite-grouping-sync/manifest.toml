# BENCH-088 (R02 T24): TPLP Figure 5 under the sync harness.
#
# Derivation: x sends A() to y in every tick from tick 0. The first copy arrives in tick 1, so first() holds at y from
# tick 2; the copy sent in tick 1 arrives in tick 2 together with first(), deriving T(), which persists.
schema = 1
id = "BENCH-088"
title = "TPLP Fig. 5 (infinite grouping): T() is derived when the second copy of A() arrives"
priority = "P1"
source = "R02 T24 and §5.4; TPLP 2016 Figure 5 (verbatim program)"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-061", "LANG-062", "LANG-190"]
program = "program.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [{ name = "x", role = "Node" }, { name = "y", role = "Node" }]

[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "pass"

[[expect]]
node = "y"
rel = "first"
row = []
holds = "2.."
absent = "..=1"

[[expect]]
node = "y"
rel = "t"
row = []
holds = "2.."
absent = "..=1"

[[expect]]
node = "x"
rel = "t"
row = []
absent = "0.."
