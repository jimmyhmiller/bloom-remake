# BENCH-095 (R05 T24; §5.7, §5.9, §9.4 item 24): Edelweiss's causal KVS: storage stays flat under dominating writes.
#
# R05 §5.9: "Causal KVS (§6) | 19 -> 62 | log once replicated everywhere and locally safe; dep once its log entry is safe;
# safe_dep and dom 'as soon as they are produced'; safe once dominated." R05 §9.4 item 24: "storage stays flat under 100%
# dominating updates." The artifact's rewrite (CausalKvsReplica_rewrite_src.rb) acknowledges all three channels,
# reclaims log (delivered everywhere, r0, and safe, r3), dep (its write and its target are safe), safe_dep (its target is
# dominated), safe (dominated, with the seal on dep implied by the flat_map: `seal_dep_id <= log {|x| [x.id]}`), dom (DR-
# once the dominated write is gone), read_buf (answered), read_resp (DR- once read_buf is gone, and acknowledged) and the
# client's read_req (acknowledged); safe_keys is a range and is never reclaimed.
#
# Scenario: replicas n1 and n2 and a client cl; n1 writes w1 (k1 = v1) at tick 1 and w2 (k1 = v2, depending on w1) at
# tick 2; n2 writes w3 (k2 = x) at tick 2; at tick 3 cl reads k1 from n2 after having seen w2. 32 seeded schedules over
# the default lossy channels, bounded by ticks. In every seed both replicas' views end as {w2, w3} and cl gets v2 exactly
# once (the read waits until w2 is safe, and dom drops w1 in the tick the read is answered). In the rewritten program
# only the live writes and the ranges remain.
schema = 1
id = "BENCH-095"
title = "Edelweiss causal KVS: reads see causally consistent values; logs, dependencies and dominated writes reclaimed"
priority = "P1"
source = "R05 T24, §5.7, §5.9, §9.4 item 24; Edelweiss (VLDB 2014) §6, Fig. 6; artifact causal-kvs.rb, CausalKvsReplica_rewrite_src.rb"
features = ["LANG-023", "LANG-040", "LANG-041", "LANG-042", "LANG-043", "LANG-045", "LANG-047", "LANG-050", "LANG-060", "LANG-061", "LANG-062", "LANG-082", "LANG-088", "LANG-241", "SEM-040", "SEM-073", "TEST-001", "ANA-060", "ANA-061", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066", "DIST-007"]
