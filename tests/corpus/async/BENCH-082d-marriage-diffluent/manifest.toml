[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-065", "LANG-069", "LANG-220", "SEM-021", "ANA-022", "ANA-023", "ANA-024", "ANA-025", "ANA-029"]
until = "M5"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-065", "LANG-069", "LANG-220", "SEM-021", "ANA-022", "ANA-023", "ANA-024", "ANA-025", "ANA-029"]
until = "M7"

