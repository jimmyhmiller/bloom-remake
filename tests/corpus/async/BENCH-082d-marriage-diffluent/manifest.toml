# location column, which the frontend strips (ARCHITECTURE §13.12).
schema = 1
id = "BENCH-082"
title = "Marriage ceremony (.ded twin): diffluent; the synchronous schedule weds, and the analysis flags diffluence"
priority = "P0"
source = "R02 T14 and §7.2 (MAR Example 3, verbatim program); R05 T5"
features = ["LANG-065", "LANG-069", "LANG-220", "SEM-021", "ANA-022", "ANA-023", "ANA-024", "ANA-025", "ANA-029"]
program = "program.ded"
derived = false
