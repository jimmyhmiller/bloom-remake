# BENCH-083 (R02 T16; R05 T3): "Without coordination, some schedule collects garbage wrongly."
#
# MAR Appendix B: when garbage is computed before all refers_to messages have arrived, "reachable memory addresses
# appear in the garbage relation", and garbage persists. Bounded model checking over asynchronous schedules finds a
# run in which the address b reaches the master before H2's pointer a -> b, violating "only c is garbage".
schema = 1
id = "BENCH-083"
title = "Distributed GC without coordination: some schedule collects a live address (bounded model checking)"
priority = "P0"
source = "R02 T16 and §7.5 (MAR Appendix B, Example 7, verbatim program); R05 T3"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-046", "LANG-047", "LANG-061", "LANG-062", "LANG-082", "LANG-201", "VER-001", "VER-002"]
program = "program.bls"
spec = "spec.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [{ name = "M", role = "Node" }, { name = "H1", role = "Node" }, { name = "H2", role = "Node" }]

[backend.bmc]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-046", "LANG-047", "LANG-061", "LANG-062", "LANG-082", "LANG-201", "VER-001", "VER-002"]
until = "M9"

[expect_verify]
check = "bmc"
result = "fails"
bounds = { ticks = 4, delay = 2 }
