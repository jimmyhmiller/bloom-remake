# BENCH-086 (R02 T19): the asynchronous singleton without persistence.
#
# MAR Examples 1-2: q is EDB, p is sent in every tick, and every tick's copy picks its own arrival tick; the ultimate
# models over all stable models are {} and {p}. R02 T19: "p is not persisted, so p(n1) is ultimate only when arrivals
# eventually cover every step (a cofinite arrival set). The program is diffluent even with fair delivery." PLAN M1.4:
# the analysis must fail to certify consistency under fair runs (CR-29). The program has no point of order at all: the
# missing certificate comes from the unguarded asynchronous head (ANA-024, ANA-141), not from non-monotonicity.
#
# Oracle (sync harness): a copy sent in tick t arrives in tick t+1, so arrivals cover every tick from 1: p holds from
# tick 1 on (the {p} ultimate model).
schema = 1
id = "BENCH-086"
title = "Asynchronous singleton: not persisted, so not certified; the synchronous schedule keeps p true from tick 1"
priority = "P1"
source = "R02 T19 and §7.1-7.2 (MAR Examples 1-2, verbatim program)"
features = ["LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-062", "LANG-190", "ANA-022", "ANA-024", "ANA-025", "ANA-029", "ANA-141"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-045", "LANG-046", "LANG-060", "LANG-062", "LANG-190", "ANA-022", "ANA-024", "ANA-025", "ANA-029", "ANA-141"]
until = "M7"

[[expect]]
node = "n1"
rel = "p"
row = []
holds = "1.."
absent = "0"

[expect_analysis]
points_of_order = { complete = true, edges = [], clusters = [] }
certificates = { p = [] }
fair_consistency = { p = "not_certified" }
