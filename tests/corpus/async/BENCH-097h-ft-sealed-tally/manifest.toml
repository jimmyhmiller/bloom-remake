# BENCH-097 (R13 §12 T10): (f) a sealed tally: `tally >= 3` is final early, the exact count at the last seal.
#
# R13 T10: "Election votes arrive from 5 voters, each followed by that voter's seal on vote[election=e].
# tally(e, count) is provisional until all 5 seals are in, then final with the exact count. A threshold tally ≥ 3 is
# final-true as soon as 3 votes arrive, before any seal."
#
# Scenario (sync harness): voter Vi votes (and seals election 1) in tick i; each vote and its seal reach C in tick
# i + 1. The third vote arrives in tick 4: at_least_three holds, final at once. The fifth vote and seal arrive in tick
# 6: every producer has sealed election 1 with a matching digest, so the partition is closed and tally(1, 5) is final
# (SEALED). The earlier tallies (1, 3) and (1, 4) are never final.
schema = 1
id = "BENCH-097"
title = "Free termination (f): tally >= 3 is final early; the exact tally is final at the last seal"
priority = "P0"
source = "R13 §12 T10; FT (ICDT 2025) §5.2"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-100", "LANG-123", "LANG-126", "LANG-207", "LANG-212", "LANG-241", "ANA-120", "ANA-121", "SEM-016"]
program = "program.bls"
derived = false
expected_from = "literature"

[deploy]
nodes = [
    { name = "V1", role = "Node" },
    { name = "V2", role = "Node" },
    { name = "V3", role = "Node" },
    { name = "V4", role = "Node" },
    { name = "V5", role = "Node" },
    { name = "C", role = "Node" },
]

[run]
ticks = 12
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-100", "LANG-123", "LANG-126", "LANG-207", "LANG-212", "LANG-241", "ANA-120", "ANA-121", "SEM-016"]
until = "M6"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-100", "LANG-123", "LANG-126", "LANG-207", "LANG-212", "LANG-241", "ANA-120", "ANA-121", "SEM-016"]
until = "M7"


[[input]]
node = "V1"
tick = 1
rel = "cast"
rows = [[1, "yes"]]

[[input]]
node = "V2"
tick = 2
rel = "cast"
rows = [[1, "yes"]]

[[input]]
node = "V3"
tick = 3
rel = "cast"
rows = [[1, "yes"]]

[[input]]
node = "V4"
tick = 4
rel = "cast"
rows = [[1, "yes"]]

[[input]]
node = "V5"
tick = 5
rel = "cast"
rows = [[1, "yes"]]

[[expect]]
node = "C"
rel = "tally"
row = [1, 3]
holds = "4"
absent = "5.."

[[expect]]
node = "C"
rel = "tally"
row = [1, 5]
holds = "6.."
absent = "..=5"

[[expect]]
node = "C"
rel = "tally_final"
row = [1, 5]
holds = "6.."
absent = "..=5"

[[expect]]
node = "C"
rel = "tally_final"
row = [1, 4]
absent = "0.."

[[expect]]
node = "C"
rel = "tally_final"
row = [1, 3]
absent = "0.."

[[expect]]
node = "C"
rel = "at_least_three"
row = [1]
holds = "4.."
absent = "..=3"

[[expect]]
node = "C"
rel = "three_final"
row = [1]
holds = "4.."
absent = "..=3"

[expect_analysis]
finality = { tally = ["SEALED"], at_least_three = ["THRESH"] }
