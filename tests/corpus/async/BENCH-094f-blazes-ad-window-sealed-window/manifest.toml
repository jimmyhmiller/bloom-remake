# BENCH-094 (R05 T14; Blazes §5.2.2): WINDOW over a click stream sealed on window is Async.
#
# Blazes §5.2.2: "Similarly, WINDOW (given an input stream sealed on window) reduces to Async." §6.2: WINDOW "will
# produce deterministic output contents if we delay its execution until we have accumulated a complete, immutable
# partition to process (for each value of the window attribute)." R05 §4.4.2: "WINDOW (OR_{id,window}) with click stream
# Seal_window ⇒ Async." compatible({id, window}, {window}) holds by identity; the coordination is sealing on window at
# `report`.
#
# Annotations (ANA-040, white box; Blazes §5.2.1): `report` logs clicks (click -> response: CW, the click only writes
# the log the query reads) and answers requests (request -> response: OR_id,window, WINDOW's group-by columns); `cache`
# reads its store and forwards (request -> answer, request -> forward: CR) and stores answers (response -> answer/share,
# peer -> answer: CW). Both components are replicated (`#[replicated]` on their output streams). The only cycle is the
# cache's self-edge through `share`: "Cache and Report form no cycle, because Cache provides no path from r to q"
# (Blazes §4.2).
schema = 1
id = "BENCH-094"
title = "Blazes, ad reporting with WINDOW and clicks sealed on window: protected, Async end to end"
priority = "P1"
source = "R05 T14, §4.4.1, §4.4.2 (reference derivations) and §9.3 item 14; Blazes (ICDE 2014) §1.3, §3.4, §4, §5.2, §7"
features = ["LANG-003", "LANG-004", "LANG-009", "LANG-040", "LANG-042", "LANG-043", "LANG-060", "LANG-062", "LANG-088", "LANG-153", "ANA-040", "ANA-041", "ANA-042", "ANA-045", "LANG-047", "LANG-100", "LANG-207", "ANA-043"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = "The Bloom ad-reporting source (~125 LOC) is not published; the program is re-derived from the paper's description and Fig. 5 queries."

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-003", "LANG-004", "LANG-009", "LANG-040", "LANG-042", "LANG-043", "LANG-060", "LANG-062", "LANG-088", "LANG-153", "ANA-040", "ANA-041", "ANA-042", "ANA-045", "LANG-047", "LANG-100", "LANG-207", "ANA-043"]
until = "M7"

[expect_analysis.blazes]
cycles = [["cache"]]
streams = { click = "Seal(window)", ask = "Async", lookup = "Async", found = "Async", share = "Async", result = "Async" }
sinks = { answers = "Async" }
coordination = [{ at = "report", mechanism = "sealing", key = ["window"] }]

[[expect_analysis.blazes.paths]]
component = "report"
from = "click"
to = "response"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "report"
from = "request"
to = "response"
annotation = "OR"
gate = ["id", "window"]

[[expect_analysis.blazes.paths]]
component = "cache"
from = "request"
to = "forward"
annotation = "CR"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "request"
to = "answer"
annotation = "CR"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "response"
to = "answer"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "response"
to = "share"
annotation = "CW"

[[expect_analysis.blazes.paths]]
component = "cache"
from = "peer"
to = "answer"
annotation = "CW"
