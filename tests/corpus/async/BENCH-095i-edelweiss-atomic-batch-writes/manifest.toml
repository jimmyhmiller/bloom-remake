# BENCH-095 (R05 T25; §5.7, §5.9, §9.4 item 25): Edelweiss's atomic multi-register writes: commits reclaimed via seals.
#
# R05 §5.9: "Atomic multi-register writes (§7.2) | 4 -> 17 | write once reflected in write_log (notin pushed into the join);
# commit needs a client seal on write.batch." The artifact's rewrite (AtomicBatchWrites_rewrite_src.rb) reclaims write
# through the pulled-up negation, commit through `(commit * seal_write_batch).lefts(:batch => :batch).notin(
# r0_write_commit_missing, ...)`, and write_log and dom as in the single register.
#
# Scenario (one node, synchronous rounds): batch 1 writes x = 10 (write 1) and y = 20 (write 2) at tick 1, commits and is
# sealed at tick 2; batch 2 writes x = 30 (write 3) and commits at tick 4 and is sealed at tick 5. The live writes end as
# 2 and 3 (write 3 replaces write 1). In the rewritten program write and commit end empty (both batches are sealed and
# settled), write_log keeps the live writes and dom the marker 0.
schema = 1
id = "BENCH-095"
title = "Edelweiss atomic batch writes: batches visible at commit; writes, commits (sealed) and replaced versions reclaimed"
priority = "P1"
source = "R05 T25, §5.7, §5.9, §9.4 item 25; Edelweiss (VLDB 2014) §7.2; artifact atomic_batch_writes.rb, AtomicBatchWrites_rewrite_src.rb"
features = ["LANG-025", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-082", "LANG-087", "LANG-207", "ANA-060", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066"]
program = "program.bls"
derived = false
expected_from = "literature"

[run]
ticks = 10
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-025", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-082", "LANG-087", "LANG-207", "ANA-060", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066"]
until = "M7"

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-025", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-082", "LANG-087", "LANG-207", "ANA-060", "ANA-062", "ANA-063", "ANA-064", "ANA-065", "ANA-066"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "put"
rows = [[1, 1, "x", 10], [2, 1, "y", 20]]

[[input]]
node = "n1"
tick = 2
rel = "commit_batch"
rows = [[1]]

[[input]]
node = "n1"
tick = 2
rel = "close_batch"
rows = [[1]]

[[input]]
node = "n1"
tick = 4
rel = "put"
rows = [[3, 2, "x", 30]]

[[input]]
node = "n1"
tick = 4
rel = "commit_batch"
rows = [[2]]

[[input]]
node = "n1"
tick = 5
rel = "close_batch"
rows = [[2]]

[[expect]]
node = "n1"
rel = "live"
tick = 3
rows = [[1, 1, "x", 10, 0], [2, 1, "y", 20, 0]]

[[expect]]
node = "n1"
rel = "live"
final = true
rows = [[2, 1, "y", 20, 0], [3, 2, "x", 30, 1]]

[expect_analysis.reclaimable]
reclaimed = { write = "join_pullup", commit = "join_seal", write_log = "dr_minus", dom = "dr_minus" }
kept = {  }

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "write"
final = true
rows = []

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "commit"
final = true
rows = []

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "write_log"
final = true
rows = [[2, 1, "y", 20, 0], [3, 2, "x", 30, 1]]

[[expect_analysis.reclaimable.storage]]
node = "n1"
rel = "dom"
final = true
rows = [[0]]
