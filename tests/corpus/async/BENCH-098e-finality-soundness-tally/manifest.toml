# BENCH-098 (R13 §12 T15; TEST-088): finality soundness under fuzzing, over BENCH-097 (f) (R13 T10).
#
# R13 T10: "Election votes arrive from 5 voters, each followed by that voter's seal on vote[election=e].
# tally(e, count) is provisional until all 5 seals are in, then final with the exact count. A threshold tally ≥ 3 is
# final-true as soon as 3 votes arrive, before any seal." R13 T15 fuzzes it: the tally is replicated at two counters,
# every voter votes and seals at both, and 10⁴ seeded schedules with at most one crash (a voter or a counter) must
# never produce a final tally other than 5, nor two different final tallies.
schema = 1
id = "BENCH-098"
title = "Finality soundness under fuzzing (e): replicated sealed tallies finalize only the exact count"
priority = "P1"
source = "R13 §12 T15 over T10; FEATURES TEST-088; FT (ICDT 2025) §5.2"
features = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-100", "LANG-123", "LANG-126", "LANG-201", "LANG-207", "LANG-212", "LANG-241", "ANA-120", "ANA-121", "SEM-016", "SEM-070", "SEM-073", "TEST-001", "TEST-002", "TEST-081", "TEST-088", "VER-001"]
program = "program.bls"
spec = "spec.bls"
derived = false
expected_from = "literature"
notes = "The spec's scenario facts are BENCH-097 (f)'s inputs. A second counter makes the agreement half of T15 observable."

[deploy]
nodes = [
    { name = "V1", role = "Node" },
    { name = "V2", role = "Node" },
    { name = "V3", role = "Node" },
    { name = "V4", role = "Node" },
    { name = "V5", role = "Node" },
    { name = "C1", role = "Node" },
    { name = "C2", role = "Node" },
]

[run]
ticks = 40
stop = "ticks"
seeds = 10000

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-042", "LANG-043", "LANG-045", "LANG-060", "LANG-062", "LANG-100", "LANG-123", "LANG-126", "LANG-201", "LANG-207", "LANG-212", "LANG-241", "ANA-120", "ANA-121", "SEM-016", "SEM-070", "SEM-073", "TEST-001", "TEST-002", "TEST-081", "TEST-088", "VER-001"]
until = "M8"

[expect_verify]
check = "sim"
result = "holds"
