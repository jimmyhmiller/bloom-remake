# BENCH-095 (R05 T26; §5.8): bud-gc's ReclaimOuter unit tests (negative-difference reclamation, DR−, ANA-064).
#
# R05 §5.8: DR− applies to X.notin(Y, :A => :B) when X and Y are persistent, A is a key of X ("the negation qual columns on
# X [must be] exactly X's key columns") and the downstream uses are reclaim-safe. The rewrite adds a range X_keys, drops
# later insertions of a key already in it (duplicate suppression), reclaims X by DR+ and reclaims Y "only after the
# matching X tuple is gone", one tick later. Conditions from several rules combine with AND.
#
# Fixtures (bud-gc test/tc_gc.rb), each ported with prefixed relation names:
# - ro: ReclaimOuter, test_outer_reclaim_simple.
#   y is keyed on all its columns (Bud: y_key): the test later inserts y(6, 49) beside y(6, 11), a key conflict in
#   the program without the rewrite. DR− only needs the keys of the positive input x.
# - ri: ReclaimOuterIntersect, test_outer_reclaim_intersect.
#   t3 is keyed on all its columns (Bud: key): the test later inserts t3(7, 99) beside t3(7, 12).
# - rv: ReclaimOuterIntersectInverse, test_outer_reclaim_intersect_inverse.
#   t2 and t3 are keyed on all their columns (Bud: key): the test later inserts t2(7, 121) beside t2(7, 120).
# - rc: ReclaimOuterInnerCombine, test_outer_inner_reclaim_combine.
# - rp: ReclaimOuterPending, test_outer_reclaim_pending.
#   Bud re-inserts [6, 12] for key 6; the port re-inserts the reclaimed tuple [6, 11]: a different value for a
#   key of t1 is a key conflict without the rewrite (DR− assumes keys determine tuples).
# - rill: ReclaimOuterIllegal, test_outer_reclaim_illegal.
