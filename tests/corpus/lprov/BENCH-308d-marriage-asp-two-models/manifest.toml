R11 T9: 3 schedules give M1 = {votes ↦ {bride, groom}, at_least_one, both} and 6 give M1 ∪ {exactly_one}. EFF 1 allows
no omission, so the choice is only the arrival tick of each vote. The invariant "exactly_one never holds" fails in
the 6 schedules whose arrivals differ, so the check must fail; the model and ultimate-model counts are pinned in
`bounds` for the backend's enumeration mode.
"""

[backend.asp]
status = "unimplemented"
