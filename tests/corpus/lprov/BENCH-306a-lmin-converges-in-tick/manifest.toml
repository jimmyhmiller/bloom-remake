schema   = 1
id       = "BENCH-306"
title    = "T7 convergence within a tick: the all-pairs lmin values match R11"
priority = "P0"
source   = "R11/G1 §7 T7 (✓sim)"
features = ["LANG-121", "LANG-122", "LANG-124", "LANG-125", "SEM-031", "SEM-032", "SEM-103", "ENG-042", "ENG-043",
            "ENG-049"]
program  = "program.bls"
derived  = false
expected_from = "literature"
notes    = """
Edges a→b 1, b→c 2, c→a 3, a→c 5 arrive at tick 1. R11 T7: a→a 6, a→b 1, a→c 3, b→a 5, b→b 6, b→c 2, c→a 3, c→b 4,
c→c 6, all computed within tick 1 (naive iteration took 4 rounds counting the final one with no change).
"""

[run]
ticks = 3
stop  = "ticks"

[[input]]
node = "n1"
tick = 1
rel  = "edge_in"
rows = [["a", "b", 1], ["b", "c", 2], ["c", "a", 3], ["a", "c", 5]]

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[[expect]]
node = "n1"
rel  = "path"
tick = 1
rows = [["a", "a", 6], ["a", "b", 1], ["a", "c", 3], ["b", "a", 5], ["b", "b", 6], ["b", "c", 2],
        ["c", "a", 3], ["c", "b", 4], ["c", "c", 6]]

[[expect]]
node  = "n1"
rel   = "path"
final = true
rows  = [["a", "a", 6], ["a", "b", 1], ["a", "c", 3], ["b", "a", 5], ["b", "b", 6], ["b", "c", 2],
         ["c", "a", 3], ["c", "b", 4], ["c", "c", 6]]
