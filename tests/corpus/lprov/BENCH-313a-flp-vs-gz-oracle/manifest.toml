until = "M5"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-122", "LANG-124", "LANG-125", "LANG-126", "LANG-190", "SEM-031", "SEM-103"]
until = "M7"

[[expect]]
node  = "n1"
rel   = "p"
row   = [["a", "b"]]
holds = "0.."

# ---- the ultimate L-model (contents at the end of the run)
[[expect]]
node  = "n1"
rel   = "p"
final = true
rows  = [[["a", "b"]]]
