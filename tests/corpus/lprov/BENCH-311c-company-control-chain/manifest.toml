schema   = 1
id       = "BENCH-311"
title    = "T12 company control, chain input: {c(a,b), c(a,c)}"
priority = "P1"
source   = "R11/G1 §7 T12 (✓sim, ✓clingo); Ross–Sagiv Ex. 2.7 and §5.6; FLP Ex. 1.1 and 2.13"
features = ["LANG-121", "LANG-122", "LANG-124", "LANG-126", "LANG-282", "SEM-031", "SEM-103"]
program  = "program.bls"
derived  = false
expected_from = "literature"
notes    = """
Input s(a,b,60), s(b,c,30), s(a,c,30): a controls b (60%); through b, a's holding in c is 30 (own) + 30 (b's) =
60%, so a controls c.
"""

[run]
ticks = 3
stop  = "ticks"

[[input]]
node = "n1"
tick = 1
rel  = "share"
rows = [["a", "b", 60], ["b", "c", 30], ["a", "c", 30]]

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-121", "LANG-122", "LANG-124", "LANG-126", "LANG-282", "SEM-031", "SEM-103"]
until = "M5"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-121", "LANG-122", "LANG-124", "LANG-126", "LANG-282", "SEM-031", "SEM-103"]
until = "M7"

[[expect]]
node = "n1"
rel  = "c"
tick = 1
rows = [["a", "b"], ["a", "c"]]

[[expect]]
node  = "n1"
rel   = "c"
final = true
rows  = [["a", "b"], ["a", "c"]]
