schema   = 1
id       = "BENCH-308"
title    = "T9 marriage ceremony, bride@2 and groom@3: exactly_one holds from tick 2, both from tick 3"
priority = "P0"
source   = "R11/G1 §7 T9 (bride@2, groom@3; ✓sim)"
features = ["LANG-124", "LANG-126", "LANG-127", "LANG-153", "LANG-241", "SEM-021", "SEM-102"]
program  = "program.bls"
derived  = false
expected_from = "literature"
notes    = """
R11's schedule (bride's vote arrives at tick 2, the groom's at tick 3) is reproduced in the lockstep harness by the
groom vowing one tick later. exactly_one holds from tick 2 on (it persists), both from tick 3.
Ultimate L-model for this schedule (R11 T9): M1 ∪ {exactly_one}; the `final` rows state it.
"""

[deploy]
nodes = [{ name = "bride", role = "Party" }, { name = "groom", role = "Party" }, { name = "o", role = "Officiant" }]

[run]
ticks = 6
stop  = "ticks"

[[input]]
node = "bride"
tick = 1
rel  = "say_yes"
rows = [[]]

[[input]]
node = "groom"
tick = 2
rel  = "say_yes"
rows = [[]]

[backend.oracle]
status = "pass"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-124", "LANG-126", "LANG-127", "LANG-153", "LANG-241", "SEM-021", "SEM-102"]
until = "M7"

[[expect]]
node = "o"
rel  = "votes"
tick = 2
rows = [[["bride"]]]

[[expect]]
node   = "o"
rel    = "exactly_one"
row    = []
absent = "..=1"
holds  = "2.."

[[expect]]
node   = "o"
rel    = "both"
row    = []
absent = "..=2"
holds  = "3.."

[[expect]]
node   = "o"
rel    = "at_least_one"
row    = []
absent = "..=1"
holds  = "2.."

# ---- the ultimate L-model (contents at the end of the run)
[[expect]]
node  = "o"
rel   = "votes"
final = true
rows  = [[["bride", "groom"]]]

[[expect]]
node  = "o"
rel   = "at_least_one"
final = true
rows  = [[]]

[[expect]]
node  = "o"
rel   = "both"
final = true
rows  = [[]]

[[expect]]
node  = "o"
rel   = "exactly_one"
final = true
rows  = [[]]
