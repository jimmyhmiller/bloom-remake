With EFF 4 the gossip at ticks 2 and 3 is omittable too. The support is
Φ = m(cl,r1,1) ∧ (m(r1,r3,2) ∨ m(r1,r3,3)) ∨ m(cl,r2,1) ∧ (m(r2,r3,2) ∨ m(r2,r3,3)), whose minimal hitting sets are
