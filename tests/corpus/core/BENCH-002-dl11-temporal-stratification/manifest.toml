schema = 1
id = "BENCH-002"
title = "DL11 Ex. 4: accepted although not syntactically stratifiable"
priority = "P0"
source = "R02 §3.4 and §17 T2 (DL11 Example 4, Definitions 1-3, Lemma 2); FEATURES.md BENCH-002, SEM-020"
features = ["SEM-020", "SEM-022", "ANA-002", "LANG-065", "LANG-041", "LANG-043", "LANG-061", "LANG-082", "LANG-047", "LANG-060"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Acceptance is checked twice: the analysis backend must stratify the program (p_pos and p_neg share stratum 0,
because the only negative edge is inductive), and the oracle must run it. `strata` maps each relation named in the
source to its stratum under SEM-022 (the longest same-tick path to it, counting negative edges, from 0).
Scenario (derived from the program): three facts are inserted, `delete_p(10)` at tick 5 removes the two facts whose
third column is 10 from tick 6 on, and a re-insertion at tick 8 brings one back."""

[run]
ticks = 12
stop = "ticks"

[backend.analysis]
status = "unimplemented"
unimplemented = ["SEM-020", "SEM-022", "ANA-002", "LANG-065", "LANG-041", "LANG-043", "LANG-061", "LANG-082", "LANG-047", "LANG-060"]
until = "M5"

[backend.oracle]
status = "unimplemented"
unimplemented = ["SEM-020", "SEM-022", "ANA-002", "LANG-065", "LANG-041", "LANG-043", "LANG-061", "LANG-082", "LANG-047", "LANG-060"]
until = "M5"

[backend.interp]
status = "unimplemented"
unimplemented = ["SEM-020", "SEM-022", "ANA-002", "LANG-065", "LANG-041", "LANG-043", "LANG-061", "LANG-082", "LANG-047", "LANG-060", "SEM-002"]
until = "M7"

[expect_analysis]
strata = { p_pos = 0, p_neg = 0 }

[[input]]
node = "n1"
tick = 1
rel = "insert_p"
rows = [[1, 2, 10]]

[[input]]
node = "n1"
tick = 2
rel = "insert_p"
rows = [[3, 4, 10], [5, 6, 20]]

[[input]]
node = "n1"
tick = 5
rel = "delete_p"
rows = [[10]]

[[input]]
node = "n1"
tick = 8
rel = "insert_p"
rows = [[1, 2, 10]]

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 2, 10]
absent = "..=0"
holds = "1..=5"

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 2, 10]
absent = "6..=7"
holds = "8.."

[[expect]]
node = "n1"
rel = "p_pos"
row = [3, 4, 10]
holds = "2..=5"
absent = "6.."

[[expect]]
node = "n1"
rel = "p_pos"
row = [5, 6, 20]
absent = "..=1"
holds = "2.."

[[expect]]
node = "n1"
rel = "p_neg"
tick = 5
rows = [[1, 2, 10], [3, 4, 10]]

[[expect]]
node = "n1"
rel = "p_pos"
tick = 6
rows = [[5, 6, 20]]
