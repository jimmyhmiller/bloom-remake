schema = 1
id = "BENCH-040"
title = "Per-tick vs sticky choose over a persisted table (canonical mode): pick m,m,c,c,p,-,m; spick m,m,m,c,p,-,m"
priority = "P0"
source = "R12 §12 T1 (choose over a persisted table, inserts and retraction); FEATURES.md SEM-085, LANG-115, BENCH-040"
features = ["SEM-083", "SEM-085", "LANG-065", "LANG-108", "LANG-114", "LANG-115", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-060"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
cand(a) is {m,p} at 1-2, {c,m,p} at 3, {c,p} at 4, {p} at 5, {} at 6, {m} at 7. Canonical-mode choices from R12's
table: pick = m, m, c, c, p, -, m; spick = m, m, m, c, p, -, m (held m is revoked at 4; the held value is dropped at
6, so 7 is a fresh choice). Bud's behaviour (m, m, m, p, p, -, m) is a reference for TEST-014 (BENCH-049), not an
expectation of ours. Judgement call: canonical mode is realized with choose_least!/least (see the program)."""

