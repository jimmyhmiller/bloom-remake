schema = 1
id = "BENCH-009"
title = "DI §3.3.1 soft state with a mocked clock (.ded twin)"
priority = "P1"
source = "R02 §3.3 and §17 T10 (Declarative Imperative §3.3.1); R01 T8; FEATURES.md BENCH-009, CR-17"
features = ["SEM-060", "LANG-065", "LANG-069", "LANG-220"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
Same scenario and expectations as BENCH-009a; nodes and inputs come from the program's `@k` facts. The mocked clock
starts at tick 1 (10) instead of tick 0, which changes no expectation: every tuple is born at tick 2 or later, so
mock_now is 10·t at every tick that matters. Rows are written without the location column."""

[run]
ticks = 14
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "unimplemented"
unimplemented = ["SEM-060", "LANG-065", "LANG-069", "LANG-220", "SEM-002"]
until = "M7"

[[expect]]
node = "n1"
rel = "mock_now"
tick = 7
rows = [[70]]

[[expect]]
node = "n1"
rel = "q"
row = ["x", 35, 20]
absent = "..=1"
holds = "2..=6"

[[expect]]
node = "n1"
rel = "q"
row = ["x", 35, 20]
absent = "7.."

[[expect]]
node = "n1"
rel = "q"
row = ["y", 35, 50]
holds = "5..=9"
absent = "10.."

[[expect]]
node = "n1"
rel = "alive"
row = ["x"]
holds = "2..=6"
absent = "7.."

[[expect]]
node = "n1"
rel = "alive"
row = ["y"]
holds = "2..=9"
absent = "10.."

[[expect]]
node = "n1"
rel = "alive"
row = ["z"]
holds = "2..=3"
absent = "4.."
