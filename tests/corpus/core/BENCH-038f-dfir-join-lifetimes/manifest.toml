schema = 1
id = "BENCH-038"
title = "DFIR join lifetimes ('tick/'static combinations) under CR-26"
priority = "P1"
source = "R08 §15 T5 (dfir_rs tests/surface_join.rs: tick_tick, tick_static, static_tick, static_static, replay_static); FEATURES.md CR-26, BENCH-038"
features = ["ENG-004", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-086", "SEM-008"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
The DFIR asserts, shifted by one tick: ('tick,'tick) and ('tick,'static) give (7,(1,0)),(7,(2,0)) at the first tick
and nothing after; ('static,'tick) gives the pairs with 0, 1 and 2 at the first three ticks and nothing after;
('static,'static) grows cumulatively. Adaptation to CR-26: DFIR runs no tick after its input stops, while a
persisted join holds at every tick under Dedalus semantics, so static_static keeps its six rows at tick 4 (the
same re-derivation that replay_static shows)."""

[run]
ticks = 6
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[[input]]
node = "n1"
tick = 1
rel = "l_in"
rows = [[7, 1], [7, 2]]

[[input]]
node = "n1"
tick = 1
rel = "r_in"
rows = [[7, 0]]

[[input]]
node = "n1"
tick = 2
rel = "r_in"
rows = [[7, 1]]

[[input]]
node = "n1"
tick = 3
rel = "r_in"
rows = [[7, 2]]

[[input]]
node = "n1"
tick = 1
rel = "l2_in"
rows = [[7, 1], [7, 2]]

[[input]]
node = "n1"
tick = 1
rel = "r2_in"
rows = [[7, 3], [7, 4]]

[[expect]]
node = "n1"
rel = "tick_tick"
tick = 1
rows = [[7, 1, 0], [7, 2, 0]]

[[expect]]
node = "n1"
rel = "tick_tick"
tick = 2
rows = []

[[expect]]
node = "n1"
rel = "tick_static"
tick = 1
rows = [[7, 1, 0], [7, 2, 0]]

[[expect]]
node = "n1"
rel = "tick_static"
tick = 2
rows = []

[[expect]]
node = "n1"
rel = "static_tick"
tick = 1
rows = [[7, 1, 0], [7, 2, 0]]

[[expect]]
node = "n1"
rel = "static_tick"
tick = 2
rows = [[7, 1, 1], [7, 2, 1]]

[[expect]]
node = "n1"
rel = "static_tick"
tick = 3
rows = [[7, 1, 2], [7, 2, 2]]

[[expect]]
node = "n1"
rel = "static_tick"
tick = 4
rows = []

[[expect]]
node = "n1"
rel = "static_static"
tick = 1
rows = [[7, 1, 0], [7, 2, 0]]

[[expect]]
node = "n1"
rel = "static_static"
tick = 2
rows = [[7, 1, 0], [7, 2, 0], [7, 1, 1], [7, 2, 1]]

[[expect]]
node = "n1"
rel = "static_static"
tick = 3
rows = [[7, 1, 0], [7, 2, 0], [7, 1, 1], [7, 2, 1], [7, 1, 2], [7, 2, 2]]

[[expect]]
node = "n1"
rel = "static_static"
tick = 4
rows = [[7, 1, 0], [7, 2, 0], [7, 1, 1], [7, 2, 1], [7, 1, 2], [7, 2, 2]]

[[expect]]
node = "n1"
rel = "replay_static"
tick = 1
rows = [[7, 1, 3], [7, 1, 4], [7, 2, 3], [7, 2, 4]]

[[expect]]
node = "n1"
rel = "replay_static"
tick = 2
rows = [[7, 1, 3], [7, 1, 4], [7, 2, 3], [7, 2, 4]]

[[expect]]
node = "n1"
rel = "replay_static"
tick = 3
rows = [[7, 1, 3], [7, 1, 4], [7, 2, 3], [7, 2, 4]]
