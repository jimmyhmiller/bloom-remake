schema = 1
id = "BENCH-044"
title = "Raft vote among same-tick RequestVotes (min<C>): one grant to c2, re-grants only to it, votes survive a restart"
priority = "P0"
source = "R12 §12 T5 (voter rules of R07 §11.3); FEATURES.md SEM-072, SEM-085, FLAG-002, FLAG-006, FLAG-007, BENCH-044"
features = ["SEM-071", "SEM-072", "SEM-085", "LANG-044", "LANG-108", "LANG-114", "LANG-117", "LANG-042", "LANG-043", "LANG-047", "LANG-061", "LANG-062", "LANG-082", "LANG-093", "LANG-100", "LANG-153", "LANG-200", "LANG-241", "LANG-040", "LANG-085"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
R12 T5, shifted by one tick (the host loads n1 at tick 1 and requests arrive one tick after they are sent):
n1 starts with current_term 4, no vote and last log entry (7, 3). Tick 2: RequestVotes for term 5 from c2 (7, 3),
c3 (8, 3) and c4 (6, 3); c2 and c3 are up to date, c4 is behind. Tick 3: c3 and c2 retransmit. Tick 4: c5 asks for
term 6 (7, 3). Tick 5: c2 asks again for the stale term 5. Tick 6: n1 restarts (a new incarnation that reloads its
durable state); c3 asks for term 6, which arrives at tick 7.
Expected (R12 T5 (a)): tick 2 grants c2 (true) and refuses c3 and c4 (false, term 5); tick 3 re-grants c2 and
refuses c3, with no second grant in term 5; tick 4 grants c5 for term 6; tick 5 refuses the stale term with term 6;
tick 7 refuses c3 because the reloaded voted_for(6, c5) holds. Not observable in the synchronous harness: that
voted_for is durable before the replies are released (SEM-072), which the node's durability tests check."""

[deploy]
nodes = [{ name = "n1", role = "Server" }, { name = "c2", role = "Server" }, { name = "c3", role = "Server" }, { name = "c4", role = "Server" }, { name = "c5", role = "Server" }]
seed = 42

[run]
ticks = 10
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["SEM-071", "SEM-072", "SEM-085", "LANG-044", "LANG-108", "LANG-114", "LANG-117", "LANG-042", "LANG-043", "LANG-047", "LANG-061", "LANG-062", "LANG-082", "LANG-093", "LANG-100", "LANG-153", "LANG-200", "LANG-241", "LANG-040", "LANG-085"]
