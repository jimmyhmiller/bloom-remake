schema = 1
id = "BENCH-018"
title = "P2 seAtomicity: count is 0 within the fixpoint of the insertion; tCounter counts 0..10 across ticks"
priority = "P0"
source = "R01 §4.4 and TEST PROGRAMS T13 (declarativitydotnet/p2 doc/seAtomicity.olg); FEATURES.md SEM-004, BENCH-018"
features = ["SEM-003", "SEM-004", "LANG-040", "LANG-041", "LANG-047", "LANG-048", "LANG-061", "LANG-071", "LANG-100", "LANG-106", "LANG-172", "LANG-200", "LANG-085"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
R01 T13: cerr and serr never fire (the count is 0 in the fixpoint that inserted tCounter(I)), and tCounter counts
from 0 to 10 across successive fixpoints. Derived timeline: tick k (0 <= k <= 10) has a(k), b(k), c(k, 0) and
stages t_counter(k) for k+1; tick 11 has a(11) only (11 < 11 fails); t_counter = {0..10} from tick 11 on.
Judgement calls: t3 is an insertion-delta rule (P2 compiles table-only rules to delta rules), and tSoftCounter's
TTL is kept as a soft table but not asserted (its expiry depends on the harness clock; serr cannot fire either
way because every row it stores has count 0)."""

