schema = 1
id = "BENCH-043"
title = "choose_rand under a fixed seed: valid draws, sticky until deleted, identical runs"
priority = "P0"
source = "R12 §12 T4 (choose_rand under a fixed seed); FEATURES.md SEM-084, SEM-085, LANG-108, LANG-115, BENCH-043"
features = ["SEM-083", "SEM-084", "SEM-085", "SEM-087", "TEST-011", "LANG-108", "LANG-115", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-063", "LANG-200"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
ρ = 42 is the deployment seed. The pool is loaded at tick 1; the host asks at tick 4 to delete rs's current value,
which takes effect at tick 5 (pool_size 3). Not asserted here, recorded as follow-ups in docs/plan/notes/M1.2.md:
the golden r1..r5 / rs1..rs5 values for ρ = 42 (to be generated from the frozen PRF, R12 T4.1); the statistics
over 10,000 seeds (frequency of each value in [2300, 2700], P(r_t = r_{t+1}) in [0.23, 0.27]); the ~1/4 agreement
of choose_rand across two nodes and the change of rand values after a restart (probabilistic). The certain halves
of the last two are BENCH-043b and BENCH-043c."""

[deploy]
seed = 42

[run]
ticks = 8
stop = "ticks"
replay_check = true

[backend.oracle]
status = "unimplemented"
unimplemented = ["SEM-083", "SEM-084", "SEM-085", "SEM-087", "TEST-011", "LANG-108", "LANG-115", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-063", "LANG-200"]
until = "M7"

[backend.interp]
status = "unimplemented"
unimplemented = ["SEM-083", "SEM-084", "SEM-085", "SEM-087", "TEST-011", "LANG-108", "LANG-115", "LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-063", "LANG-200", "SEM-002"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "load"
rows = [["q", 1], ["q", 2], ["q", 3], ["q", 4]]

[[input]]
node = "n1"
tick = 4
rel = "drop_chosen"
rows = [[]]

[[expect]]
node = "n1"
rel = "pool_size"
tick = 4
rows = [[4]]

[[expect]]
node = "n1"
rel = "pool_size"
tick = 5
rows = [[3]]
