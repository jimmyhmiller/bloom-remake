schema = 1
id = "BENCH-041"
title = "With a resolve policy the conflicting writers resolve to the least value instead of an error"
priority = "P0"
source = "R12 §12 T2 (resolve choose variant); LANGUAGE §10.7, §22.2; FEATURES.md LANG-117, BENCH-041"
features = ["SEM-050", "LANG-117", "LANG-108", "LANG-114", "LANG-020", "LANG-040", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-060"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Contradiction resolved by precedence: R12 applies `resolve` to same-tick writes, LANGUAGE §10.7 only to t+1
candidates, so the writers use `next`. R12's answer is kept: sel(a) = min{"m", "zz"} = "m", one tick later (from
tick 2). Derived continuation: the relation-level candidates include the persisted row, so sel(a) is the running
least of the picks and "zz": m at ticks 2-3, c from tick 4 on; sel(b) is x from tick 2 on. No BLSR001 is raised."""

