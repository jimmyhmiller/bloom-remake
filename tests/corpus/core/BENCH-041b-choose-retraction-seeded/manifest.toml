schema = 1
id = "BENCH-041"
title = "Retraction of a non-chosen candidate under the seeded choice: the choice is unchanged under every seed"
priority = "P0"
source = "R12 §12 T2; FEATURES.md SEM-050, SEM-085, TEST-013, BENCH-041"
features = ["SEM-050", "SEM-083", "SEM-084", "SEM-085", "TEST-013", "LANG-065", "LANG-108", "LANG-115", "LANG-020", "LANG-041", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-082", "LANG-200"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
The invariants of BENCH-040b; `pick_stable` is the claim of this item (deleting y changes pick(b) only if y was
chosen). The keyed view sel never raises SEM-050. At tick 3 group b has the single candidate x, so pick(b) is x
from tick 3 on under every seed."""

[deploy]
seed = 42

[run]
ticks = 9
stop = "ticks"
seeds = 128

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[backend.sim]
status = "unimplemented"
unimplemented = ["SEM-050", "SEM-083", "SEM-084", "SEM-085", "TEST-013", "LANG-065", "LANG-108", "LANG-115", "LANG-020", "LANG-041", "LANG-043", "LANG-047", "LANG-060", "LANG-061", "LANG-082", "LANG-200", "TEST-001"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "ins"
rows = [["a", "m"], ["a", "p"]]

[[input]]
node = "n1"
tick = 3
rel = "ins"
rows = [["a", "c"]]

[[input]]
node = "n1"
tick = 3
rel = "del"
rows = [["a", "m"]]

[[input]]
node = "n1"
tick = 4
rel = "del"
rows = [["a", "c"]]

[[input]]
node = "n1"
tick = 5
rel = "del"
rows = [["a", "p"]]

[[input]]
node = "n1"
tick = 7
rel = "ins"
rows = [["a", "m"]]

[[input]]
node = "n1"
tick = 1
rel = "ins"
rows = [["b", "x"], ["b", "y"]]

[[input]]
node = "n1"
tick = 2
rel = "del"
