schema = 1
id = "BENCH-037"
title = "DDlog-style firewall reachability: after +12% and -3% links the maintained result equals a recompute"
priority = "P1"
source = "R09 §16 T9 (DDlog firewall reachability, Ryzhyk & Budiu Datalog 2.0 2019 Fig. 8); FEATURES.md ENG-062, BENCH-037"
features = ["ENG-004", "ENG-042", "ENG-062", "LANG-040", "LANG-043", "LANG-045", "LANG-047", "LANG-060", "LANG-063", "LANG-082", "LANG-086", "LANG-190"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Judgement call: DDlog's firewall program and data are not reproduced in the sources; this is a network of the
same shape (two DAG clusters of 6 hosts, 25 links, firewall rules on the hops 2->3 and 8->9). Stages: 25 links at
tick 1 (28 reachable pairs); 3 links at tick 3, which join the clusters (64 pairs); the link 5->6 deleted at tick 5
(effective at 6: 53 pairs). Each stage's expected relation is the from-scratch transitive closure over the allowed
links, computed independently of Blossom. The benchmark's timing claim (incremental time well below recompute
time) is a performance target, not a corpus expectation."""

