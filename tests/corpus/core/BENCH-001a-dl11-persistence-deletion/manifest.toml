schema = 1
id = "BENCH-001"
title = "DL11 Ex. 3: persistence and deletion (table + delete)"
priority = "P0"
source = "R02 §3.3 and §17 T1 (DL11 Example 3); FEATURES.md BENCH-001"
features = ["SEM-005", "SEM-008", "LANG-040", "LANG-043", "LANG-060", "LANG-063"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
DL11: "p(1,2)@200, p(1,3)@200, p(1,3)@300 are true; p(1,2)@301 is false because p(1,2) was deleted at 300".
p(1,2) is still true at 300: deletion takes effect at the next tick (SEM-005). Quiescent from 302: the state at
302 is equivalent modulo time to the state at 301 (DL11 Def. 6), and no input arrives later. The run is long
enough (320 ticks) to observe that; expectations stop two ticks before the end of the run."""

[run]
ticks = 320
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[[input]]
node = "n1"
tick = 101
rel = "p"
rows = [[1, 2]]

[[input]]
node = "n1"
tick = 102
rel = "p"
rows = [[1, 3]]

[[input]]
node = "n1"
tick = 300
rel = "p_neg"
rows = [[1, 2]]

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 2]
absent = "..=100"

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 2]
holds = "101..=300"
absent = "301.."

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 3]
absent = "..=101"
holds = "102.."

[[expect]]
node = "n1"
rel = "p_pos"
tick = 200
rows = [[1, 2], [1, 3]]

[[expect]]
node = "n1"
rel = "p_pos"
tick = 301
rows = [[1, 3]]

[[expect]]
quiescent_from = 302
