notes = """
Compile-only. LANGUAGE §14.6: "The rewrite mirrors remote relations, so it is exact only for insert-only relations:
a mirrored relation with a `delete` or `upsert` is BLS0805." sb1 and sb3 read pred at SI, and set_pred deletes
from pred, so each is BLS0805 (one per localized body, §20: "a localized body that ... mirrors a relation with
deletions"). sb2 reads only succ, which is insert-only, so it is rewritten and draws the mandatory BLS1005.
Judgement call: BLS1005 is expected only on the body the compiler rewrites. §14.6 lists it with the rewrite ("rewrites
each location change ..., prints the rewrite, and always emits BLS1005"), and a body rejected with BLS0805 is not
rewritten. The runtime counterpart is BENCH-026c, which reads the insert-only pred_seen instead."""

