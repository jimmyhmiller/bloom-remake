notes = """
R12 T6's table. Inputs: tick 1 log {1:+1, 2:+3, 3:-2} and commit 2; tick 2 log 4:+5 and commit 4; tick 4 log 5:+10
and commit 5; tick 5 log 0:+7, inserted before the applied prefix, which forces the aggregate form to refold from
key 0 (276) while the carried sm ignores it. `bad` grows geometrically once the log is complete, so the run stops
before it can overflow i64 (BLSR004). Not asserted: ENG-073's O(|delta|) cost on appends (performance) and the
ANA-011 lint on `bad` (BENCH-045b); the false commutativity claim is BENCH-045c."""

