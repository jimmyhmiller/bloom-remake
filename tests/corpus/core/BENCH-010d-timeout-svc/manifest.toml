schema = 1
id = "BENCH-010"
title = "Molly timeout_svc: timer_svc(H, I, 3)@k fires timeout(H, I) at k+2 unless cancelled"
priority = "P0"
source = "R02 §12.5 and §17 T11 (Molly util/timeout_svc.ded, verbatim rules); FEATURES.md BENCH-010"
features = ["LANG-069", "LANG-220", "LANG-081", "SEM-003"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
The three rules are Molly's verbatim; the facts are a driver of ours (so derived = true). t1 is armed at 2:
timer_state 2 at 3, 1 at 4, timeout at 4 = k+2. t2 is armed at 4 (state 2 at 5) and cancelled at 5, which
blocks the countdown, so t2 never times out."""

[run]
ticks = 12
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-069", "LANG-220", "LANG-081", "SEM-003", "SEM-002"]
until = "M7"

[[expect]]
node = "n1"
rel = "timer_state"
tick = 3
rows = [["t1", 2]]

[[expect]]
node = "n1"
rel = "timer_state"
tick = 4
rows = [["t1", 1]]

[[expect]]
node = "n1"
rel = "timeout"
row = ["t1"]
absent = "..=3"
holds = "4"

[[expect]]
node = "n1"
rel = "timeout"
row = ["t1"]
absent = "5.."

[[expect]]
node = "n1"
rel = "timer_state"
tick = 5
rows = [["t2", 2]]

[[expect]]
node = "n1"
rel = "timer_state"
tick = 6
rows = []

[[expect]]
node = "n1"
rel = "timeout"
row = ["t2"]
absent = "..=9"
