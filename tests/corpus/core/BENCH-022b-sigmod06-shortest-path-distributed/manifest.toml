schema = 1
id = "BENCH-022"
title = "SIGMOD06 shortest path (distributed): the same final costs at every router"
priority = "P0"
source = "R01 §5.6, §8.1 and TEST PROGRAMS T2 (SIGMOD06 Figs. 1-2, Algorithm 2; CACM09 sp2a/sp2b); FEATURES.md BENCH-022"
features = ["LANG-040", "LANG-042", "LANG-045", "LANG-047", "LANG-060", "LANG-062", "LANG-086", "LANG-100", "LANG-150", "LANG-152", "LANG-153", "LANG-241", "LANG-190"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Final state (R01 T2): a->b 2 [a,c,b], a->c 1, a->d 3 [a,c,b,d], e->a 1, e->c 2, e->b 3, e->d 4. R01 T2 also says
shortestPath(a,b,[a,c,b],2) replaces the earlier [a,b],5, and path(a,d,[a,b,d],6) appears at iteration 2. With one
round per hop (derived): router a's shortest to b is [a,b] 5 at tick 0 and [a,c,b] 2 from tick 1; its path to d
via b ([a,b,d], 6) arrives at tick 1 (SIGMOD06's second iteration); e converges at tick 3."""

[deploy]
nodes = [{ name = "a", role = "Router" }, { name = "b", role = "Router" }, { name = "c", role = "Router" }, { name = "d", role = "Router" }, { name = "e", role = "Router" }]

[run]
ticks = 10
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[[expect]]
node = "a"
rel = "shortest_path"
row = ["b", ["a", "b"], 5]
holds = "0"
absent = "1.."

[[expect]]
node = "a"
rel = "shortest_path"
row = ["b", ["a", "c", "b"], 2]
absent = "0"
holds = "1.."

[[expect]]
node = "a"
rel = "path"
row = ["d", "b", ["a", "b", "d"], 6]
absent = "0"
holds = "1.."

[[expect]]
node = "a"
rel = "shortest_path"
final = true
rows = [["b", ["a", "c", "b"], 2], ["c", ["a", "c"], 1], ["d", ["a", "c", "b", "d"], 3]]

[[expect]]
node = "b"
rel = "shortest_path"
final = true
rows = [["d", ["b", "d"], 1]]

[[expect]]
node = "c"
rel = "shortest_path"
final = true
rows = [["b", ["c", "b"], 1], ["d", ["c", "b", "d"], 2]]

[[expect]]
node = "d"
rel = "shortest_path"
final = true
rows = []

[[expect]]
node = "e"
rel = "shortest_path"
final = true
rows = [["a", ["e", "a"], 1], ["b", ["e", "a", "c", "b"], 3], ["c", ["e", "a", "c"], 2], ["d", ["e", "a", "c", "b", "d"], 4]]

[[expect]]
node = "e"
rel = "shortest_path"
tick = 3
rows = [["a", ["e", "a"], 1], ["b", ["e", "a", "c", "b"], 3], ["c", ["e", "a", "c"], 2], ["d", ["e", "a", "c", "b", "d"], 4]]
