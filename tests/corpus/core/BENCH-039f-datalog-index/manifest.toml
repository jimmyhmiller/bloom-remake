schema = 1
id = "BENCH-039"
title = "dfir-datalog test_index under CR-46: per-tick canonical ranks, re-ranked over a persisted input"
priority = "P1"
source = "R08 §15 T8 (dfir_datalog_core lib.rs test test_index); R12 §5.9; FEATURES.md CR-46, LANG-097, BENCH-039"
features = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-093", "LANG-097", "LANG-118"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Inputs and outputs are ours. Tick 1: ints {(3,1), (1,2)}; tick 2: ints {(2,3)}. result ranks the tick's tuples:
(1,2)->0, (3,1)->1 at tick 1; (2,3)->0 at tick 2. result3 ranks the persisted set: at tick 2 (2,3) takes rank 1
and (3,1) moves to 2. result5 keeps every (tuple, rank) it has seen, so (3,1) appears with ranks 1 and 2."""

[run]
ticks = 4
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-093", "LANG-097", "LANG-118"]
until = "M5"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-043", "LANG-047", "LANG-060", "LANG-093", "LANG-097", "LANG-118", "SEM-002"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "ints"
rows = [[3, 1], [1, 2]]

[[input]]
node = "n1"
tick = 2
rel = "ints"
rows = [[2, 3]]

[[expect]]
node = "n1"
rel = "result"
tick = 1
rows = [[1, 2, 0], [3, 1, 1]]

[[expect]]
node = "n1"
rel = "result"
tick = 2
rows = [[2, 3, 0]]

[[expect]]
node = "n1"
rel = "result3"
tick = 1
rows = [[1, 2, 0], [3, 1, 1]]

[[expect]]
node = "n1"
rel = "result3"
tick = 2
rows = [[1, 2, 0], [2, 3, 1], [3, 1, 2]]

[[expect]]
node = "n1"
rel = "result5"
tick = 2
rows = [[1, 2, 0], [3, 1, 1], [2, 3, 1], [3, 1, 2]]
