schema = 1
id = "BENCH-001"
title = "DL11 Ex. 3 extended: insert wins over a same-tick delete (CR-05)"
priority = "P0"
source = "R02 §3.3 (DL11 §3.2 insert-vs-delete analysis); FEATURES.md CR-05, SEM-005, SEM-006, BENCH-001"
features = ["SEM-005", "SEM-006", "LANG-040", "LANG-043", "LANG-060", "LANG-061", "LANG-063"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
The insert-wins tick of the WP scope. Tick 200: `p_next(1,2)` and `p_neg(1,2)` together: (1,2) is deleted for
201 and inserted for 201, and the insertion wins, so (1,2) never disappears. Tick 150: `p(1,4)` and `p_neg(1,4)`
together: the deductive insertion holds at 150 only, and the deletion removes (1,4) from 151 on. Tick 250: a
plain deletion of (1,3)."""

[run]
ticks = 270
stop = "ticks"

[backend.oracle]
status = "pass"

[backend.interp]
status = "pass"

[[input]]
node = "n1"
tick = 101
rel = "p"
rows = [[1, 2]]

[[input]]
node = "n1"
tick = 102
rel = "p"
rows = [[1, 3]]

[[input]]
node = "n1"
tick = 150
rel = "p"
rows = [[1, 4]]

[[input]]
node = "n1"
tick = 150
rel = "p_neg"
rows = [[1, 4]]

[[input]]
node = "n1"
tick = 200
rel = "p_next"
rows = [[1, 2]]

[[input]]
node = "n1"
tick = 200
rel = "p_neg"
rows = [[1, 2]]

[[input]]
node = "n1"
tick = 250
rel = "p_neg"
rows = [[1, 3]]

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 2]
absent = "..=100"
holds = "101.."

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 4]
absent = "..=149"
holds = "150"

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 4]
absent = "151.."

[[expect]]
node = "n1"
rel = "p_pos"
row = [1, 3]
holds = "102..=250"
absent = "251.."

[[expect]]
node = "n1"
rel = "p_pos"
tick = 201
rows = [[1, 2], [1, 3]]

[[expect]]
node = "n1"
rel = "p_pos"
tick = 251
rows = [[1, 2]]
