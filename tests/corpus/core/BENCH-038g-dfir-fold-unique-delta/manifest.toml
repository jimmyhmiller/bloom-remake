schema = 1
id = "BENCH-038"
title = "DFIR fold_keyed, unique and multiset_delta lifetimes, adapted to sets and canonical order"
priority = "P1"
source = "R08 §15 T6 (DFIR operator docs: fold_keyed, unique, multiset_delta); FEATURES.md CR-03, CR-46, BENCH-038"
features = ["LANG-040", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-110", "LANG-118", "LANG-181", "SEM-007", "LANG-060", "LANG-100"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
Words: tick 1 (hello: oakland, berkeley, san francisco), tick 2 (hello: palo alto). fold_tick is
"berkeley, oakland, san francisco, " then "palo alto, " (DFIR's arrival order gave "oakland, berkeley, ...";
CR-46 fixes canonical order). fold_static at tick 2 folds all four words.
Numbers: tick 1 {3, 4} (DFIR's input 3, 3, 4, 3 is one set), tick 2 {3, 5}. unique_tick re-emits 3 at tick 2;
unique_static emits only 5 at tick 2; multiset_delta is {3, 4} then {5} (DFIR emits "5, 3" because it counts
multiplicities, which CR-03 removes)."""

[run]
ticks = 4
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-110", "LANG-118", "LANG-181", "SEM-007", "LANG-060", "LANG-100"]
until = "M5"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-040", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-110", "LANG-118", "LANG-181", "SEM-007", "LANG-060", "LANG-100", "SEM-002"]
until = "M7"

[[input]]
node = "n1"
tick = 1
rel = "word"
rows = [["hello", "oakland"], ["hello", "berkeley"], ["hello", "san francisco"]]

[[input]]
node = "n1"
tick = 2
rel = "word"
rows = [["hello", "palo alto"]]

[[input]]
node = "n1"
tick = 1
rel = "num"
rows = [[3], [3], [4], [3]]

[[input]]
node = "n1"
tick = 2
rel = "num"
rows = [[3], [5]]

[[expect]]
node = "n1"
rel = "fold_tick"
tick = 1
rows = [["hello", "berkeley, oakland, san francisco, "]]

[[expect]]
node = "n1"
rel = "fold_tick"
tick = 2
rows = [["hello", "palo alto, "]]

[[expect]]
node = "n1"
rel = "fold_static"
tick = 2
rows = [["hello", "berkeley, oakland, palo alto, san francisco, "]]

[[expect]]
node = "n1"
rel = "unique_tick"
tick = 1
rows = [[3], [4]]

[[expect]]
node = "n1"
rel = "unique_tick"
tick = 2
rows = [[3], [5]]

[[expect]]
node = "n1"
rel = "unique_static"
tick = 1
rows = [[3], [4]]

[[expect]]
node = "n1"
rel = "unique_static"
tick = 2
rows = [[5]]

[[expect]]
node = "n1"
rel = "multiset_delta"
tick = 1
rows = [[3], [4]]

[[expect]]
node = "n1"
rel = "multiset_delta"
tick = 2
rows = [[5]]
