schema = 1
id = "BENCH-023"
priority = "P1"
features = ["ENG-004", "ENG-062", "LANG-040", "LANG-043", "LANG-047", "LANG-063", "LANG-064", "LANG-086", "LANG-100", "SEM-005", "LANG-085"]
program = "program.bls"
derived = true
expected_from = "literature"
title = "Incremental shortest paths, one change per tick (THESIS Fig. 5.7): every stage equals evaluation from scratch"
source = "R01 §5.5 and TEST PROGRAMS T3 (Loo thesis §5.4.2 Fig. 5.7, Theorem A.3; SIGMOD06 Fig. 2 network); FEATURES.md BENCH-023"
notes = """
THESIS Fig. 5.7 on the SIGMOD06 network: updating #link(a,b,5) to cost 1 replaces path(a,d,b,[a,b,d],6) by
[a,b,d],2 and path(e,d,a,[e,a,b,d],7) by 3; deleting #link(b,d,1) removes path(b,d,[b,d],1), path(a,d,[a,b,d],2)
and path(e,d,[e,a,b,d],3). Changes applied FIFO, one per tick: links set at tick 1 (visible from 2), the update at
tick 4 (visible from 5), the deletion at tick 7 (visible from 8). Each stage's expected contents are the
from-scratch shortest paths of that stage's links (derived by hand from SP1-SP4)."""

[run]
ticks = 12
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["ENG-004", "ENG-062", "LANG-040", "LANG-043", "LANG-047", "LANG-063", "LANG-064", "LANG-086", "LANG-100", "SEM-005", "LANG-085"]
until = "M6"

[backend.interp]
status = "unimplemented"
unimplemented = ["ENG-004", "ENG-062", "LANG-040", "LANG-043", "LANG-047", "LANG-063", "LANG-064", "LANG-086", "LANG-100", "SEM-005", "LANG-085", "SEM-002"]
until = "M7"

