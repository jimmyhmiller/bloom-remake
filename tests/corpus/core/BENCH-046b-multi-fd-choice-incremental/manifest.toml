title = "Multi-FD choice under an insertion: only the new edge's conflict component changes"
priority = "P1"
source = "R12 §12 T7 (incremental: adding (3,c) at t2); FEATURES.md LANG-116, ENG-075, BENCH-046"
features = ["LANG-116", "ENG-075", "LANG-108", "SEM-085", "LANG-040", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-200", "LANG-041"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
g = {(1,a), (1,b), (2,a)} at tick 1; (3,c) is added at tick 2. The greedy multi-FD scan accepts (3,c), which
conflicts with nothing, and keeps every earlier acceptance (invariant component_stable). ENG-075's claim that only
the affected component is recomputed is the engine's cost; its observable consequence is asserted here."""

