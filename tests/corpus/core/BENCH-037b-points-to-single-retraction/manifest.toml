notes = """
Judgement call: DOOP itself (136 rules over Java bytecode) is out of reach of a hand-checked case, so the
retraction is shown on Andersen's analysis. Retracting assign(v1, v4) at tick 3 (effective at 4) removes six
points-to facts, including heap facts derived through store. Expected relations computed independently of
Blossom. The "milliseconds" claim is a performance target, not a corpus expectation."""

