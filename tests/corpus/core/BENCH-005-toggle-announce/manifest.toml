schema = 1
id = "BENCH-005"
title = "DI Fig. 1: toggle/announce alternates state 0/1 and announces asynchronously"
priority = "P1"
source = "R02 §3.2 and §17 T5 (Declarative Imperative Fig. 1, seed state(0)@1 added by R02); FEATURES.md BENCH-005"
features = ["LANG-041", "LANG-043", "LANG-046", "LANG-047", "LANG-060", "LANG-061", "LANG-062", "LANG-081"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
state is 0 at odd ticks and 1 at even ticks from tick 1 on (seed at tick 1). The announcement of toggle(x) sent at
tick t arrives at t+1 (synchronous rounds deliver self-sends in the next round, PLAN §5.1), so announce(t) equals
state(t) from tick 2 on."""

[run]
ticks = 30
stop = "ticks"

[backend.oracle]
