notes = """
R12 T3: batches {x, a, m} at tick 1, {} at 2, {b} at 3, {z, c} at 4. slot: a0 m1 x2, then b3, then c4 z5;
next_slot is 0, 3, 3, 4, 6 at ticks 1-5. rank over all_req re-ranks every tick (a0 b1 m2 x3 at tick 3). seq gives
a0 m1 x2 b3 c4 z5 and never renumbers. Duplicate payload: {a, a} at tick 6 is one fact and takes one slot (6).
The ANA-011 lint on rank is BENCH-042b. Judgement call: R12's `next_slot(0) :- bootstrap` is the boot tick."""

