schema = 1
id = "BENCH-040"
title = "Per-tick vs sticky choose over a persisted table (seeded): validity under every seed"
priority = "P0"
source = "R12 §12 T1 (seeded invariants); FEATURES.md SEM-083, SEM-085, LANG-115, TEST-013, BENCH-040"
features = ["SEM-083", "SEM-084", "SEM-085", "TEST-013", "LANG-065", "LANG-108", "LANG-115", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-200"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
R12's seeded invariants, as program invariants (a violation aborts the tick with BLSR003 and fails the case):
pick_t is a candidate, unique, total and unchanged while its value stays and nothing arrives; spick keeps its
held value while it is a candidate. Seed-independent rows: tick 5 (only p), tick 6 (nothing), tick 7 (only m).
The simulator runs 128 seeds; its per-seed choices must also equal the oracle's (ENG-067), which the
differential runner checks. Not asserted: every priority permutation (TEST-012 choice exploration, M8)."""

[deploy]
seed = 42

[run]
ticks = 9
stop = "ticks"
seeds = 128

[backend.oracle]
status = "unimplemented"
unimplemented = ["SEM-083", "SEM-084", "SEM-085", "TEST-013", "LANG-065", "LANG-108", "LANG-115", "LANG-041", "LANG-043", "LANG-047", "LANG-061", "LANG-082", "LANG-200"]
