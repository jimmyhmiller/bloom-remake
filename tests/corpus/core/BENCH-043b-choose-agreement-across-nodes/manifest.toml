schema = 1
id = "BENCH-043"
title = "Two nodes with the same candidates always agree on choose (shared choice seed)"
priority = "P0"
source = "R12 §12 T4 item 4 and T11 (HRW agreement); FEATURES.md SEM-084, SEM-085, CR-45, BENCH-043"
features = ["SEM-084", "SEM-085", "LANG-108", "LANG-040", "LANG-042", "LANG-045", "LANG-047", "LANG-062", "LANG-152", "LANG-153", "LANG-200", "LANG-241", "LANG-100", "LANG-060"]
program = "program.bls"
derived = true
expected_from = "literature"
notes = """
The invariant fails the run if a received choice differs from the receiver's own. Each node hears the other from
tick 1 on (heard_count 1). The simulator repeats the check for 128 seeds, i.e. 128 choice seeds."""

[deploy]
nodes = [{ name = "n1", role = "Peer" }, { name = "n2", role = "Peer" }]
seed = 42

[run]
ticks = 6
stop = "ticks"
seeds = 128

[backend.oracle]
status = "unimplemented"
unimplemented = ["SEM-084", "SEM-085", "LANG-108", "LANG-040", "LANG-042", "LANG-045", "LANG-047", "LANG-062", "LANG-152", "LANG-153", "LANG-200", "LANG-241", "LANG-100", "LANG-060"]
until = "M6"

[backend.interp]
status = "unimplemented"
unimplemented = ["SEM-084", "SEM-085", "LANG-108", "LANG-040", "LANG-042", "LANG-045", "LANG-047", "LANG-062", "LANG-152", "LANG-153", "LANG-200", "LANG-241", "LANG-100", "LANG-060", "SEM-002"]
until = "M7"

[backend.sim]
status = "unimplemented"
unimplemented = ["SEM-084", "SEM-085", "LANG-108", "LANG-040", "LANG-042", "LANG-045", "LANG-047", "LANG-062", "LANG-152", "LANG-153", "LANG-200", "LANG-241", "LANG-100", "LANG-060", "TEST-001"]
until = "M7"

[[expect]]
node = "n1"
rel = "heard_count"
final = true
rows = [[1]]

[[expect]]
node = "n2"
rel = "heard_count"
final = true
rows = [[1]]
