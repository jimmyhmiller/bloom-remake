# BENCH-102 (R03 T13): Bud's test also asserts that `c <= [[...]]` (an instantaneous merge into a channel) raises
# `Bud::CompileError`. In Blossom that is `emit` into a channel, which the operator x collection legality matrix
# forbids (LANGUAGE §12, LANG-066): BLS0400 at the offending statement (line 27 of program.bls).
#
# The compile backend compares the complete diagnostic list (PLAN §5.2), so BLS0400 must be the program's only
# diagnostic. The program therefore leaves out Bud's channel key and the keyed payload tables of BENCH-102a/b: a
# keyed table filled from a channel can draw the key-conflict lint BLS1003 (ANA-007), which is not what this case
# tests (see program.bls).
