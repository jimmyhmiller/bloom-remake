schema   = 1
id       = "BENCH-066"
title    = "Hydro lattice ops: Cartesian bimorphism gives 6 pairs, state[items] emits only changes, reduce gives Max(5)"
priority = "P1"
source   = "R04 §12 T20; R04 §7.4 (DFIR lattice_bimorphism, state, lattice_reduce)"
features = ["LANG-043", "LANG-071", "LANG-122", "LANG-123", "LANG-124", "LANG-125", "SEM-030", "SEM-031"]
program  = "program.bls"
derived  = true
expected_from = "literature"
notes    = """
Two nodes run the program with different interleavings. n1: lhs 0 @1, rhs 3 @2, lhs 1 @3, lhs 2 and rhs 4 @4, so
pairs grows {(0,3)} @2, {(0,3),(1,3)} @3, all six @4. n2: all of lhs @1 and all of rhs @3, so pairs is empty until
tick 3 and then has all six. Both end with the same six pairs (R04: "all 6 pairs regardless of arrival
interleaving"). state[items]: items 1, 2 @1; 1, 3 @2; 2, 3, 4 @3 change the set only by {1,2}, {3}, {4}, which is
exactly what `changed` emits. lattice_reduce: 1..5 at tick 1 give Max(5).
"""

[deploy]
nodes = [{ name = "n1", role = "Node" }, { name = "n2", role = "Node" }]

[run]
ticks = 6
stop  = "ticks"

[[input]]
node = "n1"
tick = 1
rel  = "lhs"
rows = [[0]]

[[input]]
node = "n1"
tick = 2
rel  = "rhs"
rows = [[3]]

[[input]]
node = "n1"
tick = 3
rel  = "lhs"
rows = [[1]]

[[input]]
node = "n1"
tick = 4
rel  = "lhs"
rows = [[2]]

[[input]]
node = "n1"
tick = 4
rel  = "rhs"
rows = [[4]]

[[input]]
node = "n2"
tick = 1
rel  = "lhs"
rows = [[0], [1], [2]]

[[input]]
node = "n2"
tick = 3
rel  = "rhs"
rows = [[3], [4]]

[[input]]
node = "n1"
tick = 1
rel  = "items"
rows = [[1], [2]]

[[input]]
node = "n1"
tick = 2
rel  = "items"
rows = [[1], [3]]

[[input]]
node = "n1"
tick = 3
rel  = "items"
rows = [[2], [3], [4]]

[[input]]
node = "n1"
tick = 1
rel  = "nums"
rows = [[1], [2], [3], [4], [5]]

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-071", "LANG-122", "LANG-123", "LANG-124", "LANG-125", "SEM-030", "SEM-031"]
until = "M6"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-043", "LANG-071", "LANG-122", "LANG-123", "LANG-124", "LANG-125", "SEM-030", "SEM-031"]
until = "M7"

[[expect]]
node = "n1"
rel  = "pairs"
tick = 2
rows = [[[[0, 3]]]]

[[expect]]
node = "n1"
rel  = "pairs"
tick = 3
rows = [[[[0, 3], [1, 3]]]]

[[expect]]
node  = "n1"
rel   = "pairs"
final = true
rows  = [[[[0, 3], [0, 4], [1, 3], [1, 4], [2, 3], [2, 4]]]]

[[expect]]
node = "n2"
rel  = "pairs"
tick = 2
rows = []

[[expect]]
node  = "n2"
rel   = "pairs"
final = true
rows  = [[[[0, 3], [0, 4], [1, 3], [1, 4], [2, 3], [2, 4]]]]

[[expect]]
node = "n1"
rel  = "changed"
tick = 1
rows = [[1], [2]]

[[expect]]
node = "n1"
rel  = "changed"
tick = 2
rows = [[3]]

[[expect]]
node = "n1"
rel  = "changed"
tick = 3
rows = [[4]]

[[expect]]
node = "n1"
rel  = "changed"
tick = 4
rows = []

[[expect]]
node  = "n1"
rel   = "reduced"
row   = [5]
holds = "1.."
