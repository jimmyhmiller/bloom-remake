schema   = 1
id       = "BENCH-079"
title    = "Free termination, FT Fig. 1(b): the accept and reject sinks are both FT, with different values"
priority = "P1"
source   = "R13 §12 T11 (FT Ex. 4 / Fig. 1; Power diss. Fig. 3.1 ★ marks); R13 §8.6 (Prop. 26) and §9.5 (ANA-122)"
features = ["LANG-004", "LANG-023", "LANG-064", "LANG-190", "SEM-016", "ANA-122"]
program  = "program.bls"
derived  = true
expected_from = "literature"
notes    = """
Re-derived from R13 T11's description: "the accepting sink (two a's seen before any second b) and the rejecting sink
(second b seen first)". Acc (accepted = true) and Rej (accepted = false) are sinks, so both are FT with different
values; every other state can still reach both sinks, so none of them is FT.
"""

[backend.analysis]
status = "unimplemented"
unimplemented = ["LANG-004", "LANG-023", "LANG-064", "LANG-190", "SEM-016", "ANA-122"]
until = "M7"

[expect_analysis]
# ANA-122 over the #[finite] component: `class` is its ANA-120 class and `ft` the exact table of free-termination
# states, keyed by the value of the component's state register and giving the query's value there. Every state not
# listed is not FT.
finality = { "dfa.accepted" = { class = "FINITE", ft = { Acc = true, Rej = false } } }
