schema   = 1
id       = "BENCH-070"
title    = "Lattice persistence: persistent keeps, tick-scoped resets, next lands at t+1, bootstrap-only keeps"
priority = "P0"
source   = "R04 §12 T24 (Bud PendingLatticeMerge, BootstrapNoRules); CR-24; LANG-128"
features = ["LANG-122", "LANG-124", "LANG-128", "LANG-190", "SEM-012", "SEM-030", "SEM-104"]
program  = "program.bls"
derived  = true
expected_from = "literature"
notes    = """
Inputs: put 5 at tick 1 and put 3 at tick 3; put_next 9 at tick 2. The persistent cell is 5 from tick 1 on (3 is
smaller). The scratch cell is 5 at tick 1, ⊥ (absent) at tick 2, 3 at tick 3 and ⊥ again at tick 4. The `next`
merge made at tick 2 is visible from tick 3. The bootstrap-only set {1,2} holds from the boot tick on.
"""

[run]
ticks = 6
stop  = "ticks"

[[input]]
node = "n1"
tick = 1
rel  = "put"
rows = [[5]]

[[input]]
node = "n1"
tick = 2
rel  = "put_next"
rows = [[9]]

[[input]]
node = "n1"
tick = 3
rel  = "put"
rows = [[3]]

[backend.oracle]
status = "pass"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-122", "LANG-124", "LANG-128", "LANG-190", "SEM-012", "SEM-030", "SEM-104"]
until = "M7"

[[expect]]
node   = "n1"
rel    = "persistent"
row    = [5]
absent = "0"
holds  = "1.."

[[expect]]
node = "n1"
rel  = "tick_scoped"
tick = 1
rows = [[5]]

[[expect]]
node = "n1"
rel  = "tick_scoped"
tick = 2
rows = []

[[expect]]
node = "n1"
rel  = "tick_scoped"
tick = 3
rows = [[3]]

[[expect]]
node = "n1"
rel  = "tick_scoped"
tick = 4
rows = []

[[expect]]
node   = "n1"
rel    = "pending"
row    = [9]
absent = "..=2"
holds  = "3.."

[[expect]]
node  = "n1"
rel   = "boot_only"
row   = [[1, 2]]
holds = "0.."
