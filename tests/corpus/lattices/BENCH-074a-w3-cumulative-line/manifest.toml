schema   = 1
id       = "BENCH-074"
title    = "W3 cumulative wrapper over lossy gossip on a line A—B—C: same final state as BENCH-073, C learns A via B"
priority = "P1"
source   = "R13 §12 T2; R13 §6.3 (W3); DIST-016"
features = ["LANG-138", "LANG-142", "LANG-153", "LANG-155", "LANG-158", "LANG-241", "SEM-036", "SEM-073", "DIST-016",
            "ENG-070", "TEST-001", "TEST-002"]
program  = "program.bls"
derived  = false
expected_from = "literature"
notes    = """
R13 T1's operations on R13 T2's line: A and C are edge nodes, B is the hub. A: +x @1, +x @2, −y @5; B: −x @1, +z
and −z @3; C: +y @1. Losses are scripted on both hops at the first sends (A→B @1, B→C @2, C→B @1) and the
simulator randomizes delays in every seed; W3's anti-entropy repairs them without acknowledgements. Final state at
every node: x = 1, y absent, z never present. C never talks to A, so every x it holds came through B (`edge_received`
at C lists x and y, both relayed or originated by B). R13 T2's "anti-entropy every 5 ticks", "50% loss" and
duplication are wrapper and simulator configuration that manifest schema v1 cannot express; the mutation test ("apply
C′ instead of C′ − C") mutates the compiler-inserted wrapper, so it is expressed with an explicit W3 in BENCH-074c.
"""

[deploy]
nodes = [{ name = "A", role = "Edge" }, { name = "B", role = "Hub" }, { name = "C", role = "Edge" }]

[run]
ticks = 200
stop  = "quiescent"
seeds = 32

[[fault]]
kind      = "omit"
from      = "A"
to        = "B"
send_tick = 1

[[fault]]
kind      = "omit"
from      = "C"
to        = "B"
send_tick = 1

[[fault]]
kind      = "omit"
from      = "B"
to        = "C"
send_tick = 2

[[input]]
node = "A"
tick = 1
rel  = "edge_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 2
rel  = "edge_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 5
rel  = "edge_update"
rows = [["y", -1]]

[[input]]
node = "B"
tick = 1
rel  = "hub_update"
rows = [["x", -1]]

[[input]]
node = "B"
tick = 3
rel  = "hub_update"
rows = [["z", 1], ["z", -1]]

[[input]]
node = "C"
tick = 1
rel  = "edge_update"
rows = [["y", 1]]

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-138", "LANG-142", "LANG-153", "LANG-155", "LANG-158", "LANG-241", "SEM-036", "SEM-073",
                 "DIST-016", "ENG-070", "TEST-001", "TEST-002"]
until = "M8"

[[expect]]
node  = "A"
rel   = "edge_raw"
final = true
rows  = [["x", 1]]

[[expect]]
node  = "B"
rel   = "hub_raw"
final = true
rows  = [["x", 1]]

[[expect]]
node  = "C"
rel   = "edge_raw"
final = true
rows  = [["x", 1]]

[[expect]]
node  = "C"
rel   = "edge_received"
final = true
rows  = [["x"], ["y"]]

[[expect]]
node   = "A"
rel    = "edge_raw"
row    = ["z", 1]
absent = "0.."

[[expect]]
node   = "C"
rel    = "edge_raw"
row    = ["z", 1]
absent = "0.."

[[expect]]
node   = "C"
rel    = "edge_raw"
row    = ["z", -1]
absent = "0.."
