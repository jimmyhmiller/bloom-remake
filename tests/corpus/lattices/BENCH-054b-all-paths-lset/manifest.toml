final = true
rows  = [[[["a", "b", 1], ["a", "c", 3], ["a", "c", 5], ["a", "d", 4], ["a", "d", 6], ["b", "c", 2],
           ["b", "d", 3], ["c", "d", 1]]]]

[[expect]]
node = "n1"
