notes    = """
Fig. 2 ported rule for rule: `votes` is a table fed by the channel and `cnt` is a relational count over it. The
count is the one point of order R04 T1 requires the analysis to flag ("non-monotone at group/count"); the
comparison `n >= QUORUM_SIZE` is over a plain value and adds none. The expected report names the construct by its
surface location: the aggregate column of view `cnt`.
"""

