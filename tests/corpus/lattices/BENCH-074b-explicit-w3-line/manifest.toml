schema   = 1
id       = "BENCH-074"
title    = "Explicit W3 over lossy gossip on a line A—B—C: every replica converges to x = 1, y absent"
priority = "P1"
source   = "R13 §12 T2; R13 §6.3 (W3 lattice and unwrap, verbatim construction) and §6.6 (the wrapper as a program)"
features = ["LANG-047", "LANG-085", "LANG-088", "LANG-100", "LANG-102", "LANG-124", "LANG-131", "LANG-138", "LANG-153",
            "LANG-173", "SEM-073", "TEST-001", "TEST-002"]
program  = "program.bls"
derived  = true
expected_from = "literature"
notes    = """
The construction is R13 §6.3's, written out with ordinary relations and lattices (R13 §6.6 keeps such an executable
wrapper as the specification of the built-in). Topology: A — B — C (neighbor links given at tick 1). Operations are
R13 T1's with integer weights. Gossip ships the whole per-origin map every 5 ticks with no acknowledgements; scripted
drops remove the first gossip on both hops, and the simulator randomizes delays. After the last update the next
gossip rounds carry every origin's final entry to every replica (C gets A's entry only through B), so at the end of
the run every replica has x = 1 and no y and no z. The program never quiesces (the logical timer), so the run stops
after 120 ticks.
"""

[deploy]
nodes = [{ name = "A", role = "Replica" }, { name = "B", role = "Replica" }, { name = "C", role = "Replica" }]

[run]
ticks = 120
stop  = "ticks"
seeds = 32

[[fault]]
kind      = "omit"
from      = "A"
to        = "B"
send_tick = 4

[[fault]]
kind      = "omit"
from      = "B"
to        = "C"
send_tick = 4

[[input]]
node = "A"
tick = 1
rel  = "neighbor_in"
rows = [["B"]]

[[input]]
node = "B"
tick = 1
rel  = "neighbor_in"
rows = [["A"], ["C"]]

[[input]]
node = "C"
tick = 1
rel  = "neighbor_in"
rows = [["B"]]

[[input]]
node = "A"
tick = 1
rel  = "local_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 2
rel  = "local_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 5
rel  = "local_update"
rows = [["y", -1]]

[[input]]
node = "B"
tick = 1
rel  = "local_update"
rows = [["x", -1]]

[[input]]
node = "B"
tick = 3
rel  = "local_update"
rows = [["z", 1], ["z", -1]]

[[input]]
node = "C"
tick = 1
rel  = "local_update"
rows = [["y", 1]]

[backend.sim]
status = "unimplemented"
unimplemented = ["LANG-047", "LANG-085", "LANG-088", "LANG-100", "LANG-102", "LANG-124", "LANG-131", "LANG-138",
                 "LANG-153", "LANG-173", "SEM-073", "TEST-001", "TEST-002"]
until = "M7"

[[expect]]
node  = "A"
rel   = "raw"
final = true
rows  = [["x", 1]]

[[expect]]
node  = "B"
rel   = "raw"
final = true
rows  = [["x", 1]]

[[expect]]
node  = "C"
rel   = "raw"
final = true
rows  = [["x", 1]]

