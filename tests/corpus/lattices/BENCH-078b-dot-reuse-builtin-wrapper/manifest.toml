schema   = 1
id       = "BENCH-078"
title    = "Dot reuse after a crash: with the built-in wrapper (incarnation bump or durable seq) nothing is lost"
priority = "P1"
source   = "R13 §12 T14 (\"With the incarnation bump, no update is lost\"); R13 §6.2; DIST-015"
features = ["LANG-044", "LANG-138", "LANG-142", "LANG-153", "LANG-158", "SEM-036", "SEM-070", "SEM-071", "DIST-015",
            "DIST-021", "DIST-033"]
program  = "program.bls"
derived  = true
expected_from = "literature"
notes    = """
The BENCH-078a scenario with the built-in W2: A: +x @1, +x @2; crash at tick 5, restart at tick 6; +y @7. The
wrapper's dots after the restart are fresh (DIST-015: the incarnation increments on every restart unless the seq is
durable), so B applies y at tick 8. Final: A and B both hold {x:2, y:1}.
"""

[deploy]
nodes = [{ name = "A", role = "Replica" }, { name = "B", role = "Replica" }]

[run]
ticks = 12
stop  = "ticks"

[[fault]]
kind = "crash"
node = "A"
tick = 5

[[fault]]
kind = "restart"
node = "A"
tick = 6

[[input]]
node = "A"
tick = 1
rel  = "local_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 2
rel  = "local_update"
rows = [["x", 1]]

[[input]]
node = "A"
tick = 7
rel  = "local_update"
rows = [["y", 1]]

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-044", "LANG-138", "LANG-142", "LANG-153", "LANG-158", "SEM-036", "SEM-070", "SEM-071",
                 "DIST-015", "DIST-021", "DIST-033"]
until = "M8"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-044", "LANG-138", "LANG-142", "LANG-153", "LANG-158", "SEM-036", "SEM-070", "SEM-071",
                 "DIST-015", "DIST-021", "DIST-033"]
until = "M8"

[[expect]]
node = "B"
rel  = "raw"
tick = 8
rows = [["x", 2], ["y", 1]]

[[expect]]
node  = "A"
rel   = "raw"
final = true
rows  = [["x", 2], ["y", 1]]

[[expect]]
node  = "B"
rel   = "raw"
final = true
rows  = [["x", 2], ["y", 1]]
