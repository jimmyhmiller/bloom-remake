schema   = 1
id       = "BENCH-067"
title    = "Flo threshold: thresh(7) over a monotone sum fires exactly once, however the input is batched"
priority = "P1"
source   = "R04 §12 T21 (Hydro monotone_fold_threshold: fold over [1..6], threshold_greater_or_equal(7) → 7); R04 §8"
features = ["LANG-071", "LANG-123", "LANG-124", "LANG-125", "LANG-126", "SEM-030"]
program  = "program.bls"
derived  = false
expected_from = "literature"
notes    = """
The input is Hydro's [1..6], batched three ways on three nodes: b1 gets one number per tick (running sums 1, 3, 6,
10 …, so the threshold is crossed at tick 4); b2 gets [1,2,3] at tick 1 and [4,5,6] at tick 2 (6, then 21: crossed at
tick 2); b3 gets all six at tick 1 (crossed at tick 1). Each node records `fired(7)` once and emits 7 in exactly one
tick. The sum is lpset's SUM(DISTINCT …), which equals the plain sum here because the inputs are distinct.
"""

[deploy]
nodes = [{ name = "b1", role = "Node" }, { name = "b2", role = "Node" }, { name = "b3", role = "Node" }]

[run]
ticks = 9
stop  = "ticks"

[[input]]
node = "b1"
tick = 1
rel  = "num"
rows = [[1]]

[[input]]
node = "b1"
tick = 2
rel  = "num"
rows = [[2]]

[[input]]
node = "b1"
tick = 3
rel  = "num"
rows = [[3]]

[[input]]
node = "b1"
tick = 4
rel  = "num"
rows = [[4]]

[[input]]
node = "b1"
tick = 5
rel  = "num"
rows = [[5]]

[[input]]
node = "b1"
tick = 6
rel  = "num"
rows = [[6]]

[[input]]
node = "b2"
tick = 1
rel  = "num"
rows = [[1], [2], [3]]

[[input]]
node = "b2"
tick = 2
rel  = "num"
rows = [[4], [5], [6]]

[[input]]
node = "b3"
tick = 1
rel  = "num"
rows = [[1], [2], [3], [4], [5], [6]]

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-071", "LANG-123", "LANG-124", "LANG-125", "LANG-126", "SEM-030"]
until = "M6"

[backend.interp]
status = "unimplemented"
unimplemented = ["LANG-071", "LANG-123", "LANG-124", "LANG-125", "LANG-126", "SEM-030"]
until = "M7"

[[expect]]
node   = "b1"
rel    = "emitted"
row    = [7]
absent = "..=3"
holds  = "4"

[[expect]]
node   = "b1"
rel    = "emitted"
row    = [7]
absent = "5.."

[[expect]]
node   = "b2"
rel    = "emitted"
row    = [7]
absent = "..=1"
holds  = "2"

[[expect]]
node   = "b2"
rel    = "emitted"
row    = [7]
absent = "3.."

[[expect]]
node   = "b3"
rel    = "emitted"
row    = [7]
absent = "0"
holds  = "1"

[[expect]]
node   = "b3"
rel    = "emitted"
row    = [7]
absent = "2.."

[[expect]]
node  = "b1"
rel   = "fired"
final = true
rows  = [[7]]

[[expect]]
node  = "b2"
rel   = "fired"
final = true
rows  = [[7]]

[[expect]]
node  = "b3"
rel   = "fired"
final = true
rows  = [[7]]
