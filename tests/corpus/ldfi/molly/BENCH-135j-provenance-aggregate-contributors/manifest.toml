# BENCH-135j-provenance-aggregate-contributors: provenance: aggregate contributors.
# Blossom golden corpus, Molly LDFI parity (docs/design/PLAN.md §5; tests/corpus/ldfi/README.md).

schema = 1
id = "BENCH-135"
title = "provenance: aggregate contributors"
priority = "P0"
source = "FEATURES.md BENCH-135; R06 §12.6"
features = ["LANG-220", "LANG-005", "LANG-060", "SEM-004", "LANG-100", "LANG-101"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
BENCH-135 "3 and 1 contributors" (the aggregate-provenance test of Molly's provenance suite, R06 §12.6; program written for the corpus, ../lib/unit/agg_contributors.ded): tally(k, "x", 3) has 3 contributors and tally(k, "y", 1) has 1.

Molly round k is tick k (CR-13); the rows omit the location column. The provenance counts this program is about are in ../golden/provenance.toml.
"""

[deploy]
nodes = [
  { name = "k", role = "Node" },
]

[run]
ticks = 3
stop = "ticks"

[backend.oracle]
status = "pass"

# 3 contributors to the first, 1 to the second
[[expect]]
node = "k"
rel = "tally"
tick = 1
rows = [["x", 3], ["y", 1]]
