# BENCH-131r-2pc-failure-free: 2pc: the failure-free run.
# Blossom golden corpus, Molly LDFI parity (docs/design/PLAN.md §5; tests/corpus/ldfi/README.md).

schema = 1
id = "BENCH-131"
title = "2pc: the failure-free run"
priority = "P0"
source = "FEATURES.md BENCH-131; R06 §12.2; LDFI SIGMOD'15 §5.1.1"
features = ["LANG-220", "LANG-005", "LANG-065", "LANG-060", "LANG-061", "LANG-062", "SEM-003", "SEM-004", "SEM-020"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
Gray's 2PC without failures: vote request at 1, votes at 2, coordinator commit at 4, participants at 5.

Molly round k is tick k (CR-13); an @async message sent at tick t is delivered at t + 1. The rows omit the location column. The spec is not included: this case checks the protocol alone.
"""

[deploy]
nodes = [
  { name = "a", role = "Node" },
  { name = "b", role = "Node" },
  { name = "C", role = "Node" },
  { name = "d", role = "Node" },
]

[run]
ticks = 9
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-220", "LANG-005", "LANG-065", "LANG-060", "LANG-061", "LANG-062", "SEM-003", "SEM-004", "SEM-020"]
until = "M5"

# the coordinator asks for votes until it decides
[[expect]]
node = "C"
rel = "voting"
row = ["tx"]
holds = "1..=4"
absent = "5..=8"

[[expect]]
node = "a"
rel = "prepared"
row = ["C", "tx"]
holds = "2..=8"
absent = "..=1"

# every vote is in at tick 3
[[expect]]
node = "C"
rel = "yes_vote"
tick = 3
rows = [["a", "tx"], ["b", "tx"], ["d", "tx"]]

# the coordinator commits at the step after the last vote
[[expect]]
node = "C"
rel = "commit"
row = ["tx"]
holds = "4..=8"
absent = "..=3"

[[expect]]
node = "a"
rel = "commit"
row = ["tx"]
holds = "5..=8"
absent = "..=4"

[[expect]]
node = "b"
rel = "commit"
row = ["tx"]
holds = "5..=8"
absent = "..=4"

[[expect]]
node = "d"
rel = "commit"
row = ["tx"]
holds = "5..=8"
absent = "..=4"

[[expect]]
node = "C"
rel = "abort"
tick = 8
rows = []
