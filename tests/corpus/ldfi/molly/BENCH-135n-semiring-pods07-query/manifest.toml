# BENCH-135n-semiring-pods07-query: the PODS'07 provenance-semiring query.
# Blossom golden corpus, Molly LDFI parity (docs/design/PLAN.md §5; tests/corpus/ldfi/README.md).

schema = 1
id = "BENCH-135"
title = "the PODS'07 provenance-semiring query"
priority = "P0"
source = "FEATURES.md BENCH-135; R06 §12.6; Green, Karvounarakis, Tannen, PODS 2007, Fig. 3, Fig. 5"
features = ["LANG-220", "LANG-005", "LANG-060", "SEM-004"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
PODS'07 Figure 5(c): q(R) has the five answers (a, c), (a, e), (d, c), (d, e), (f, e); their provenance polynomials (2p^2, pr, pr, 2r^2 + rs, 2s^2 + rs) and bag multiplicities (8, 10, 10, 55, 7) are in ../golden/provenance.toml (ENG-114).

Molly round k is tick k (CR-13); the rows omit the location column. The provenance counts this program is about are in ../golden/provenance.toml.
"""

[deploy]
nodes = [
  { name = "n", role = "Node" },
]

[run]
ticks = 2
stop = "ticks"

[backend.oracle]
status = "pass"

[[expect]]
node = "n"
rel = "q"
tick = 1
rows = [["a", "c"], ["a", "e"], ["d", "c"], ["d", "e"], ["f", "e"]]
