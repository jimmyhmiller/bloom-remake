notes = """
CounterexampleSuite: 3pc is 'nonblocking' in the synchronous, fail-stop model (LDFI §5.1.1: 'Three-phase commit solves the blocking problem, under the assumption of a connected and synchronous network'). With one crash and no losses every site's timeout decision agrees: a missing vote or ack makes the coordinator abort, and its abort reaches the participants at the step their precommit timers fire; a coordinator crash leaves them all precommitted (they commit) or all merely prepared (they abort).

Programs and spec are re-derived (../lib/commit/*.ded); commit_spec.ded checks termination (at least two nodes decide once a participant prepared) and agreement exactly as Molly's commit spec does (R06 §12.2).
"""

