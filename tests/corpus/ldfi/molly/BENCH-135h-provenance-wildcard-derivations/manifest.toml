schema = 1
id = "BENCH-135"
title = "provenance: two derivations through a wildcard column"
priority = "P0"
source = "FEATURES.md BENCH-135; R06 §12.6"
features = ["LANG-220", "LANG-005", "LANG-060", "SEM-004"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
BENCH-135 "2 derivations" (the repeated-firings-with-wildcards test of Molly's provenance suite, R06 §12.6; program written for the corpus, ../lib/unit/wildcard_derivations.ded): available(n, "pen") has 2 distinct derivations, through the stock of shelf s1 and of shelf s2.

Molly round k is tick k (CR-13); the rows omit the location column. The provenance counts this program is about are in ../golden/provenance.toml.
