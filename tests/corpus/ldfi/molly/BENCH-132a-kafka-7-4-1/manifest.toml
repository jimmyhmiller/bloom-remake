Molly's CounterexampleSuite simulates the Kafka bug at 7/4/1 and finds a counterexample. Figure 10: a brief partition keeps b's and c's membership from Zookeeper, so the leader a believes it is the only in-sync replica and acknowledges the client's write alone; then a crashes and the acknowledged write is on no correct replica.

Program re-derived from the paper (../lib/kafka/replication.ded): the replication logic in some detail, Zookeeper and the client sketched, as §5.1.3 describes. The spec is Molly's durability spec (R06 §12.3). Reaching the counterexample by lineage needs the crash oracle: the violating run crashes the leader after it acknowledged, a crash that removes no message the outcome depends on and matters only through `notin crash(R, R, _)` in post (see docs/plan/notes/M1.5.md on ARCHITECTURE §8.3).
"""

