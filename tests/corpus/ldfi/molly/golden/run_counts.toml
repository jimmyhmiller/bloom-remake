# Every run count LDFI Figures 12 and 13 publish (BENCH-136), and where the corpus pins it.
# Consumers: TEST-029 (the forward/backward loop, M8.1) and the P1 search reductions TEST-030-TEST-032 (M9.4).
# Not a corpus case (no manifest). See ../README.md and ../../README.md.
#
# A run count is a property of a program and a search, so it is pinned (as `runs_max` of a BENCH-136 case) only
# where the corpus program is the one the count was measured on, or a faithful re-derivation of it with the same
# message pattern. It is not pinned where the measured program is unavailable or its measured configuration is
# vacuous: a count taken on a different program is not a parity target (docs/plan/notes/M1.5.md explains each).
# `executions` counts the failure-free run: Figure 12, up to and including the first counterexample; Figure 13, all
# executions to exhaust the hypotheses.

