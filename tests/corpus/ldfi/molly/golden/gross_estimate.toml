# Golden data for BENCH-135 (grossEstimate) and the Combinations columns of LDFI Figures 12 and 13.
# Consumer: TEST-035, the run-count estimator (P1, WP M9.4; ARCHITECTURE §8.5 "Extras").
# Not a corpus case (no manifest): manifest schema v1 has no field for estimates. See ../../README.md.
#
# Molly's estimate (FailureSpec.grossEstimate, R06 §3.7), computed with arbitrary-precision integers:
#   L          = 2^(|nodes| - 1)                                  outgoing-loss patterns per node and step
#   crashFree  = L^EFF
#   crashProne = sum over ct in 1..=EOT+1 of L^min(EFF, ct - 1)   (ct = EOT + 1 means "never crashes")
#   estimate   = C(|nodes|, crashes) * crashFree^(|nodes| - crashes) * crashProne^crashes
# It counts EFF steps of loss, although omissions are admissible only at send times < EFF (CR-21); the estimate is
# reproduced as Molly defines it, because the published Combinations were computed with it.
# `estimate` is exact (a decimal string); `published` is the figure's value, to three significant digits.

schema = 1
feature = "TEST-035"
source = "R06 §3.7 and §12.6 (Molly FailureSpecSuite); LDFI SIGMOD'15 Figures 12 and 13"

# Molly's unit tests (FailureSpecSuite, transcribed in R06 §12.6).
[[unit]]
eot = 3
eff = 0
crashes = 0
nodes = ["a", "b", "c"]
estimate = "1"
why = "the failure-free scenario is the only run"

[[unit]]
eot = 3
eff = 0
crashes = 2
nodes = ["a", "b"]
estimate = "16"
why = "fail-stop: each of the two nodes crashes at one of 4 times or never"

[[unit]]
eot = 3
eff = 0
crashes = 1
nodes = ["a"]
estimate = "4"
why = "one node crashes once or never"

[[unit]]
eot = 3
eff = 0
crashes = 2
nodes = ["a", "b", "c", "d"]
estimate = "96"
why = "respects maxCrashes: 6 ways to pick the crash-prone pair, 4 crash choices each"

[[unit]]
eot = 3
eff = 2
crashes = 0
nodes = ["a", "b"]
estimate = "16"
why = "omissions only, until EFF"

[[unit]]
eot = 3
eff = 1
crashes = 0
nodes = ["a", "b"]
estimate = "4"
why = "omissions only, until EFF"

[[unit]]
eot = 3
eff = 2
crashes = 2
nodes = ["a", "b"]
estimate = "121"
why = "a crashed node sends nothing: 1 + 2 + 4 + 4 = 11 schedules per node, squared"

[[unit]]
eot = 6
eff = 4
crashes = 1
nodes = ["a", "b", "c", "C", "Z"]
estimate = "18536856418509622775644160"
why = "must not overflow to zero (the unit test asserts only that); the exact value is the formula's and matches Figure 12's Kafka row"

