notes = """
DEVIATION FROM THE FEATURES TEXT (BENCH-131 says 'no CE at 8/0/2'; recorded in docs/plan/notes/M1.5.md). The three-phase commit the paper describes (Figure 9: the coordinator aborts when it detects a failed participant; participants that precommitted roll forward to commit on timeout) has a two-crash agreement violation without any message loss: participant a crashes after voting and before acking, the coordinator times out on the missing ack and decides abort at step 6, and crashes at step 6, before its abort leaves; b and d, precommitted, time out at 7 and commit. The decision is taken before the coordinator's crash, so the run is a violation under the paper's crash semantics (CR-20) as well as Molly's (R06 §3.4). The same run violates agreement for Molly's own 3pc.ded (found by exhaustive search of every admissible 2-crash schedule, tests/corpus/ldfi/tools/ldfi_ref.py). Molly's test table reports no counterexample, so Molly's search did not reach this run; a lineage search without negative support does not reach it either (the coordinator's abort decision has no message in its positive lineage), while ARCHITECTURE's search with conservative negative support (CR-31) finds it in 10 runs. LDFI with conservative negative support is complete (Appendix B, TEST-029) and must report it.

Programs and spec are re-derived (../lib/commit/*.ded); commit_spec.ded checks termination (at least two nodes decide once a participant prepared) and agreement exactly as Molly's commit spec does (R06 §12.2).
"""

