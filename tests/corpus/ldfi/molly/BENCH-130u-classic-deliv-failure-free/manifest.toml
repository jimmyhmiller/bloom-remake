# BENCH-130u-classic-deliv-failure-free: classic-deliv: the failure-free run.
# Blossom golden corpus, Molly LDFI parity (docs/design/PLAN.md §5; tests/corpus/ldfi/README.md).

schema = 1
id = "BENCH-130"
title = "classic-deliv: the failure-free run"
priority = "P0"
source = "FEATURES.md BENCH-130; R06 §12.1; LDFI SIGMOD'15 §3.1 and the program's figure"
features = ["LANG-220", "LANG-005", "LANG-065", "LANG-060", "LANG-061", "LANG-062", "SEM-003", "SEM-004"]
program = "program.ded"
derived = true
expected_from = "literature"
notes = """
LDFI §3.1.5: relay on receipt, deliver at the next step; the failure-free run relays forever.

Molly round k is tick k (CR-13): tick 0 has no events and the `@1` facts arrive at tick 1; an @async message sent at tick t is delivered at t + 1. The rows omit the location column, which is the node (ARCHITECTURE §13.12). The spec is not included: this case checks the protocol alone.
"""

[deploy]
nodes = [
  { name = "a", role = "Node" },
  { name = "b", role = "Node" },
  { name = "c", role = "Node" },
]

[run]
ticks = 7
stop = "ticks"

[backend.oracle]
status = "unimplemented"
unimplemented = ["LANG-220", "LANG-005", "LANG-065", "LANG-060", "LANG-061", "LANG-062", "SEM-003", "SEM-004"]
until = "M5"

# a broadcasts at tick 1; nobody sends to a at tick 1
[[expect]]
node = "a"
rel = "bcast"
row = ["data"]
holds = "1"
absent = "2"

# from tick 3 on every node relays every copy it receives
[[expect]]
node = "a"
rel = "bcast"
row = ["data"]
holds = "3..=6"

[[expect]]
node = "b"
rel = "bcast"
row = ["data"]
holds = "2..=6"
absent = "..=1"

[[expect]]
node = "c"
rel = "bcast"
row = ["data"]
holds = "2..=6"
absent = "..=1"

# delivery happens at the step after receipt
[[expect]]
node = "a"
rel = "log"
row = ["data"]
holds = "2..=6"
absent = "..=1"

[[expect]]
node = "b"
rel = "log"
row = ["data"]
holds = "3..=6"
absent = "..=2"

[[expect]]
node = "c"
rel = "log"
row = ["data"]
holds = "3..=6"
absent = "..=2"
