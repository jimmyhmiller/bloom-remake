LDFI §4.3: '(O(a,c,2) v C(a,2) v C(a,1)) & (O(b,c,1) v C(b,1)) corresponds to a derivation graph that represents two proofs' (../lib/unit/two_proofs.ded has exactly that lineage). The falsifiers are the Appendix-B-minimal ones (ARCHITECTURE §8.3: fault sets are compared by the clock facts they remove; C(n,t) removes n's outgoing clocks from t on), within the failure spec: omissions only at send times < EFF (CR-21), at most `crashes` crashes. With EFF 3 both messages can be lost, and losing them removes a subset of the clock facts any crash alternative removes, so the omission pair is the only minimal falsifier. (The formula's other minimal models, {C(a,2), O(b,c,1)} and {O(a,c,2), C(b,1)}, are not Appendix-B-minimal; see docs/plan/notes/M1.5.md on ARCHITECTURE §8.3.)
