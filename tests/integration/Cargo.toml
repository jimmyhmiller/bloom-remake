[package]
name = "blossom-integration-tests"
description = "Cross-crate tests (PLAN §4 D4): each WP owns the files tests/<prefix>_*.rs that its plan entry lists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Every internal library crate, so cross-crate tests (engine and oracle, planner and engine, simulator and driver)
# live here instead of as dev-dependencies that ARCHITECTURE §1.3 forbids inside the crates.
[dependencies]
blossom = { workspace = true, features = ["runtime", "compiler"] }
blossom-analysis.workspace = true
blossom-artifact.workspace = true
blossom-base.workspace = true
blossom-bench.workspace = true
blossom-build.workspace = true
blossom-codegen.workspace = true
blossom-driver.workspace = true
blossom-engine.workspace = true
blossom-front.workspace = true
blossom-ir.workspace = true
blossom-kernel.workspace = true
blossom-lattice.workspace = true
blossom-ldfi.workspace = true
blossom-lsp.workspace = true
blossom-node.workspace = true
blossom-oracle.workspace = true
blossom-plan.workspace = true
blossom-prov.workspace = true
blossom-rewrite.workspace = true
blossom-runtime.workspace = true
blossom-sat.workspace = true
blossom-schema.workspace = true
blossom-sim.workspace = true
blossom-smt.workspace = true
blossom-std-host.workspace = true
blossom-std-src.workspace = true
blossom-store.workspace = true
blossom-syntax.workspace = true
blossom-trace.workspace = true
blossom-value.workspace = true
blossom-verify.workspace = true
blossom-wire.workspace = true
proptest.workspace = true

[dev-dependencies]
# The test kit is a dev-dependency only of integration-test crates (ARCHITECTURE §1.3).
blossom-testkit.workspace = true
toml.workspace = true
serde_json.workspace = true
bytes.workspace = true
# The Rust codec oracle of slice 6 (decision K5): an independent Kafka protocol implementation, test-only.
kafka-protocol = { version = "0.18.0", default-features = false, features = ["client", "broker"] }
uuid = "1.18"

[lints]
workspace = true
