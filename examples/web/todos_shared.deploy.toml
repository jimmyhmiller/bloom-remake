# A one-node deployment of todos_shared.bls whose page is served by the node (docs/design/CLIENTS.md §4). From the repository
# root, after scripts/build-web.sh:
#
#   BLOSSOM_SEED=$(openssl rand -hex 16) blossom run --deploy examples/web/todos_shared.deploy.toml --node s --insecure-dev \
#       --init-fresh --web 127.0.0.1:8080
#
# then open http://localhost:8080/ in two tabs. Later runs drop --init-fresh to keep the store (and keep the same seed).
format = 1

[deployment]
id = "todos_shared-demo"
program = "todos_shared"
version = 1
source = "todos_shared.bls"

[[node]]
name = "s"
role = "Server"
addr = "127.0.0.1:7461"
principal = "spiffe://demo/todos_shared/Server/s"

[security]
mode = "insecure-dev"

[storage]
data_dir = ".data"
