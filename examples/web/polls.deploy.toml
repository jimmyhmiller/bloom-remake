# A one-node deployment of polls.bls whose page is served by the node (docs/design/CLIENTS.md §4). From the repository
# root: `scripts/run-app.sh polls`, then open http://localhost:8080/ in two tabs. By hand, after scripts/build-web.sh:
#
#   BLOSSOM_SEED=$(openssl rand -hex 16) blossom run --deploy examples/web/polls.deploy.toml --node s --insecure-dev \
#       --init-fresh --web 127.0.0.1:8080
#
# Later runs drop --init-fresh to keep the store (and keep the same seed).
# With `--admin 127.0.0.1:9900`, ask the node's database while it runs:
#
#   blossom query --deploy examples/web/polls.deploy.toml --node s --admin 127.0.0.1:9900 \
#       'open(q) = polls(_, _, _, q, _, true)'
format = 1

[deployment]
id = "polls-demo"
program = "polls"
version = 1
source = "polls.bls"

[[node]]
name = "s"
role = "Server"
addr = "127.0.0.1:7471"
principal = "spiffe://demo/polls/Server/s"

[security]
mode = "insecure-dev"

[storage]
data_dir = ".data/polls"

[web]
link = "http"
style = "polls.css"
